<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDB 知識庫 — 工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+HK:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   EDB 智能知識庫 — Facade Design System (Spec v0.1)
   Palette: Paper #F7F4ED + EDB Green #1F3A2E + Accent #8B6B2E
   Zero sparkle, zero purple gradient, zero streaming.
   Legacy var names (--cd, --mocha, --charcoal…) remapped
   to new palette so existing markup inherits automatically.
═══════════════════════════════════════════════════════ */

/* ── Design Tokens (EDB facade) ────────────────────── */
:root {
  /* Canonical EDB tokens */
  --ink:       #1B1F1A;
  --ink-2:     #3A4238;
  --ink-3:     #6B7268;
  --paper:     #F7F4ED;
  --paper-2:   #FBF9F3;
  --line:      #D8D2C4;
  --line-2:    #E8E3D6;
  --edb:       #1F3A2E;
  --edb-2:     #2E5A46;
  --edb-wash:  #E9EFE9;
  --accent:    #8B6B2E;   /* 校簿磚黃 */
  --stale:     #8A7A3B;
  --warn:      #7A3B1F;   /* 磚紅, 非 alarm red */

  /* Legacy Cloud Dancer aliases → remapped to paper palette */
  --cd:        var(--paper);
  --cd-warm:   var(--paper-2);
  --cd-cream:  var(--line-2);
  --cd-stone:  var(--line);

  /* Legacy Mocha aliases → remapped to EDB green + accent */
  --mocha:     var(--edb);
  --mocha-dk:  #0F2A1E;      /* deeper green for active/pressed */
  --mocha-lt:  var(--accent);
  --bark:      var(--edb);

  /* Neutrals alias */
  --charcoal:  var(--ink);
  --mid:       var(--ink-3);
  --sea:       var(--edb-wash);
  --border:    var(--line);
  --border-lt: var(--line-2);

  /* Legacy --p-* aliases (Tailwind overrides) */
  --p-primary:   var(--edb);
  --p-secondary: var(--accent);
  --p-accent:    var(--edb-2);
  --p-bg:        var(--paper);
  --p-surface:   var(--paper-2);
  --p-highlight: var(--line-2);
  --p-text:      var(--ink);
  --p-muted:     var(--ink-3);

  /* Fluid type */
  --text-hero: clamp(2rem, 4.5vw, 3rem);
  --text-xl:   clamp(1.1rem, 2.3vw, 1.35rem);
  --text-lg:   clamp(1rem, 2vw, 1.125rem);
  --text-base: clamp(0.9rem, 1.5vw, 1rem);
  --text-sm:   clamp(0.78rem, 1.2vw, 0.875rem);

  /* Spacing */
  --space-xs:  clamp(0.3rem, 0.8vw, 0.5rem);
  --space-sm:  clamp(0.6rem, 1.5vw, 0.875rem);
  --space-md:  clamp(1rem, 2.5vw, 1.5rem);
  --space-lg:  clamp(1.5rem, 4vw, 2.5rem);

  /* Radius — 紙本感, 非 pill (Spec §2.4) */
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;

  /* Shadows — hairline paper, 非 SaaS drop shadow */
  --shadow-sm: 0 1px 0 var(--line-2);
  --shadow-md: 0 2px 0 var(--line);
  --shadow-lg: 0 2px 0 var(--line), 0 0 0 1px var(--line);

  /* Typography stack */
  --font-sans: "Noto Sans HK","IBM Plex Sans","PingFang HK","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
  --font-mono: "IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
}

/* ── Reset & Base ──────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; }
body {
  font-family: var(--font-sans);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.65;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── Tailwind colour overrides ─────────────────────── */
.bg-white        { background: var(--cd-warm) !important; }
.bg-gray-50      { background: var(--cd) !important; }
.bg-gray-100     { background: var(--cd-cream) !important; }
.border-gray-200 { border-color: var(--border) !important; }
.border-gray-100 { border-color: var(--border-lt) !important; }
.text-gray-800   { color: var(--charcoal) !important; }
.text-gray-700   { color: var(--charcoal) !important; }
.text-gray-600   { color: var(--mid) !important; }
.text-gray-500   { color: var(--mid) !important; }
.text-gray-400   { color: var(--cd-stone) !important; }
.text-gray-300   { color: var(--border) !important; }
.shadow-sm       { box-shadow: var(--shadow-sm) !important; }
.shadow-2xl      { box-shadow: var(--shadow-lg) !important; }

/* ── K1 Dashboard Header / Nav ─────────────────────── */
.k1-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(240,238,233,0.94);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  transition: box-shadow 0.3s;
}
.k1-header.scrolled { box-shadow: var(--shadow-md); }
.k1-header-inner {
  max-width: 1400px; margin: 0 auto;
  padding: 0 var(--space-md);
  height: 60px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.k1-logo {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; text-decoration: none;
  flex-shrink: 0;
}
.k1-logo-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--mocha); flex-shrink: 0;
}
.k1-logo-text {
  font-size: 1rem; font-weight: 700;
  color: var(--charcoal); letter-spacing: -0.02em;
  line-height: 1.1;
}
.k1-logo-sub {
  font-size: 0.68rem; color: var(--mid);
  letter-spacing: 0.01em; margin-top: 1px;
}
.k1-home-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--text-sm); color: var(--mid);
  text-decoration: none; padding: 6px 12px;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  transition: all 0.2s; white-space: nowrap;
  flex-shrink: 0;
}
.k1-home-link:hover { color: var(--charcoal); border-color: var(--mocha); background: rgba(164,119,100,0.06); }
.k1-header-actions {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
}

/* ── View Mode Tabs ────────────────────────────────── */
.k1-tab-bar {
  display: flex; border-radius: var(--r-sm);
  border: 1px solid var(--border);
  overflow: hidden; background: var(--cd);
}
.filter-tab {
  transition: all 0.15s; cursor: pointer;
  padding: 7px 14px; font-size: var(--text-sm); font-weight: 500;
  border: none; background: none; color: var(--mid);
  border-right: 1px solid var(--border); white-space: nowrap;
  font-family: inherit;
}
.filter-tab:last-child { border-right: none; }
.filter-tab.active-tab {
  background: var(--charcoal); color: var(--cd);
}
.filter-tab:not(.active-tab):hover { background: var(--cd-cream); color: var(--charcoal); }

/* ── Auth / Action Buttons ─────────────────────────── */
.k1-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--r-sm);
  font-size: var(--text-sm); font-weight: 500;
  border: 1px solid var(--border); cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
  font-family: inherit; background: var(--cd-warm); color: var(--mid);
}
.k1-btn:hover { border-color: var(--mocha); color: var(--charcoal); }
.k1-btn-admin {
  background: rgba(164,119,100,0.08); color: var(--mocha-dk);
  border-color: rgba(164,119,100,0.25);
}
.k1-btn-admin:hover { background: rgba(164,119,100,0.14); }
.k1-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: 100px;
  font-size: var(--text-sm); white-space: nowrap;
}
.k1-badge-warning { background: rgba(164,119,100,0.1); color: var(--mocha-dk); border: 1px solid rgba(164,119,100,0.2); }
.k1-badge-ok { background: var(--edb-wash); color: var(--edb); border: 1px solid var(--edb-2); }
.k1-badge-error { background: var(--paper-2); color: #A83232; border: 1px solid var(--warn); }

/* ── Export Button ─────────────────────────────────── */
.export-btn {
  background: var(--charcoal); color: var(--cd);
  border: 1px solid var(--charcoal); transition: all 0.15s;
  padding: 7px 16px; border-radius: var(--r-sm);
  font-size: var(--text-sm); font-weight: 600; cursor: pointer;
  font-family: inherit;
}
.export-btn:hover { background: var(--mocha); border-color: var(--mocha); }

/* ── Main Layout ───────────────────────────────────── */
.k1-layout { max-width: 1400px; margin: 0 auto; padding: var(--space-md); }
.k1-layout-inner { display: flex; gap: var(--space-md); align-items: flex-start; }

/* ── Sidebar ───────────────────────────────────────── */
.k1-sidebar {
  width: 240px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: var(--space-sm);
}
.k1-card {
  background: var(--cd-warm);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
}
.k1-card-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-lt);
  font-size: 0.72rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--mid);
}
/* Stats card */
.k1-stat-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  text-align: center; padding: 12px;
  gap: 4px;
}
.k1-stat-num {
  font-size: 1.6rem; font-weight: 800;
  letter-spacing: -0.03em; color: var(--charcoal);
  line-height: 1;
}
.k1-stat-label { font-size: 0.68rem; color: var(--mid); margin-top: 2px; }
/* Topic/role list */
.topic-btn {
  transition: all 0.15s; display: flex;
  align-items: center; justify-content: space-between;
  width: 100%; text-align: left;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-lt);
  background: none; border-left: none; border-right: none; border-top: none;
  font-family: inherit; font-size: var(--text-sm); color: var(--mid);
  cursor: pointer;
}
.topic-btn:last-child { border-bottom: none; }
.topic-btn:hover { background: var(--cd-cream); color: var(--charcoal); }
.topic-btn.active {
  background: var(--charcoal) !important;
  color: var(--cd) !important;
  border-color: var(--charcoal) !important;
}
.topic-btn.active .k1-count { background: rgba(240,238,233,0.2); color: var(--cd); }
.k1-count {
  font-size: 0.68rem; padding: 2px 8px;
  border-radius: 100px; background: var(--cd-cream);
  color: var(--mid); font-weight: 600; flex-shrink: 0;
}
.k1-count-draft {
  font-size: 0.68rem; padding: 2px 7px;
  border-radius: 100px;
  background: rgba(164,119,100,0.12);
  color: var(--mocha-dk); font-weight: 700; margin-right: 4px;
}

/* ── Main Content ──────────────────────────────────── */
.k1-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-sm); }

/* Topic header card */
.k1-topic-header {
  background: var(--cd-warm); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: var(--space-md);
}
.k1-topic-title {
  font-size: var(--text-xl); font-weight: 800;
  letter-spacing: -0.02em; color: var(--charcoal);
}

/* Search input */
.k1-input {
  border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 8px 12px; font-size: var(--text-sm); font-family: inherit;
  background: var(--cd); color: var(--charcoal);
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}
.k1-input:focus { border-color: var(--mocha); box-shadow: 0 0 0 3px rgba(164,119,100,0.1); }

/* Keyword chips */
.k1-kw {
  font-size: 0.72rem; background: var(--cd-cream);
  color: var(--mid); padding: 2px 8px; border-radius: 4px;
}

/* Batch bar */
.batch-bar {
  background: rgba(164,119,100,0.06);
  border: 1px solid rgba(164,119,100,0.18);
  border-radius: var(--r-md); padding: 12px var(--space-md);
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.batch-bar-text { font-size: var(--text-sm); color: var(--mocha-dk); }
.k1-btn-approve-all {
  background: var(--charcoal); color: var(--cd);
  border: none; border-radius: var(--r-sm);
  padding: 7px 16px; font-size: var(--text-sm); font-weight: 600;
  cursor: pointer; transition: background 0.15s; font-family: inherit;
}
.k1-btn-approve-all:hover { background: var(--edb); }

/* ── Fact Cards ─────────────────────────────────────── */
.fact-card {
  transition: all 0.2s; background: var(--cd-warm);
  border: 1px solid var(--border); border-radius: var(--r-md);
  padding: var(--space-sm) var(--space-md);
}
.fact-card:hover { box-shadow: var(--shadow-md); }
.fact-card.draft { border-left: 3px solid var(--mocha-lt); }
.fact-card.approved { border-left: 3px solid var(--edb-2); }

/* ── Candidate review split workspace ───────────────── */
.review-workspace {
  display: grid; grid-template-columns: minmax(0, 1fr) 380px;
  gap: var(--space-md); align-items: start;
}
.review-list, .review-inspector, .review-empty {
  background: var(--cd-warm); border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.review-list { overflow: hidden; }
.review-head {
  padding: var(--space-md); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.review-head h2 { margin: 0; font-size: 1rem; color: var(--charcoal); }
.review-head p { margin: 3px 0 0; font-size: var(--text-sm); color: var(--mid); }
.review-metric {
  font-family: var(--mono); font-size: 0.72rem; color: var(--edb);
  background: var(--edb-wash); border: 1px solid rgba(31,58,46,0.12);
  padding: 5px 8px; border-radius: var(--r-sm); white-space: nowrap;
}
.candidate-row {
  width: 100%; border: 0; border-bottom: 1px solid var(--border);
  background: transparent; text-align: left; padding: 14px var(--space-md);
  cursor: pointer; font-family: inherit; display: grid; gap: 7px;
  transition: background 0.16s, border-color 0.16s;
}
.candidate-row:hover, .candidate-row.active { background: var(--paper-2); }
.candidate-row.active { box-shadow: inset 3px 0 0 var(--edb); }
.candidate-row:last-child { border-bottom: 0; }
.candidate-row-top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.candidate-topic {
  font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.06em;
  color: var(--edb); text-transform: uppercase;
}
.candidate-source {
  font-size: 0.72rem; color: var(--mid); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; max-width: 180px;
}
.candidate-text { font-size: var(--text-sm); color: var(--charcoal); line-height: 1.55; }
.candidate-roles { display: flex; flex-wrap: wrap; gap: 5px; }
.candidate-role-pill {
  font-size: 0.68rem; color: var(--mid); border: 1px solid var(--border);
  background: #fff; padding: 2px 6px; border-radius: var(--r-sm);
}
.review-inspector {
  position: sticky; top: 88px; padding: var(--space-md);
  display: grid; gap: 14px;
}
.inspector-label {
  font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--edb);
}
.inspector-title { font-size: 1.05rem; font-weight: 700; color: var(--charcoal); }
.inspector-box {
  border: 1px solid var(--border); background: var(--paper-2);
  border-radius: var(--r-sm); padding: 11px; color: var(--ink-2);
  font-size: var(--text-sm); line-height: 1.6;
}
.review-editor {
  width: 100%; min-height: 112px; resize: vertical; font-family: inherit;
  font-size: var(--text-sm); line-height: 1.6; color: var(--charcoal);
  background: #fff; border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 11px; outline: 0;
}
.review-editor:focus { border-color: var(--edb); box-shadow: 0 0 0 2px rgba(31,58,46,0.08); }
.role-toggle-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.role-toggle {
  border: 1px solid var(--border); background: #fff; color: var(--mid);
  border-radius: var(--r-sm); padding: 6px 8px; font-size: 0.72rem;
  cursor: pointer; font-family: inherit;
}
.role-toggle.active { border-color: var(--edb); background: var(--edb-wash); color: var(--edb); font-weight: 700; }
.inspector-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.review-btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink-2);
  border-radius: var(--r-sm); padding: 8px 12px; font-size: var(--text-sm);
  cursor: pointer; font-family: inherit; font-weight: 600;
}
.review-btn.primary { background: var(--edb); border-color: var(--edb); color: #fff; }
.review-btn.danger { border-color: rgba(122,59,31,0.25); color: var(--warn); }
.review-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.review-empty { padding: 42px; text-align: center; color: var(--mid); }
@media (max-width: 980px) {
  .review-workspace { grid-template-columns: 1fr; }
  .review-inspector { position: relative; top: auto; }
}

/* ── Role Badge ─────────────────────────────────────── */
.role-badge {
  font-size: 0.68rem; padding: 2px 8px; border-radius: 100px;
  font-weight: 600; display: inline-flex; align-items: center;
}

/* ── Status Badge ───────────────────────────────────── */
.status-badge {
  font-size: 0.65rem; padding: 2px 8px; border-radius: 6px;
  font-weight: 600;
}

/* ── Source link ────────────────────────────────────── */
.source-link {
  color: var(--mocha); text-decoration: underline;
  cursor: pointer; font-size: 0.75rem;
}
.source-link:hover { color: var(--mocha-dk); }

/* ── Approve / action buttons ───────────────────────── */
.approve-btn { transition: all 0.15s; cursor: pointer; }
.approve-btn:hover { transform: scale(1.15); }

/* ── Modal ──────────────────────────────────────────── */
.modal-overlay { background: rgba(58,55,53,0.5); }

/* ── Guidelines cards ───────────────────────────────── */
.guideline-card {
  transition: all 0.2s;
  border-left: 3px solid var(--mocha);
  background: var(--cd-warm);
  border-radius: var(--r-sm);
}
.guideline-card:hover { box-shadow: var(--shadow-md); border-left-color: var(--mocha-dk); }
.guide-tab { transition: all 0.15s; cursor: pointer; }
.guide-tab:hover { transform: translateY(-1px); }

/* ── QA panel ───────────────────────────────────────── */
.qa-result-card {
  transition: all 0.2s;
  border-left: 3px solid var(--mocha-lt);
  background: var(--cd-warm); border-radius: var(--r-sm);
}
.qa-result-card:hover { box-shadow: var(--shadow-md); }
.qa-highlight {
  background: rgba(196,168,130,0.35) !important;
  color: var(--charcoal) !important;
  border-radius: 2px; padding: 0 1px;
}

/* ── Stat/review stat cards in sidebar ─────────────── */
.stat-card {
  background: var(--cd-warm);
}
.review-stat {
  background: var(--cd-warm);
}

/* ── Animations ─────────────────────────────────────── */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.animate-in { animation: fadeIn 0.3s ease-out; }
/* floatWord removed — Decision 7 (WordCloud removed) */
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

/* ── Footer ─────────────────────────────────────────── */
.k1-footer {
  background: var(--charcoal); color: rgba(240,238,233,0.45);
  padding: var(--space-md); font-size: var(--text-sm);
  border-top: 1px solid rgba(240,238,233,0.08);
  margin-top: var(--space-lg);
}
.k1-footer-inner {
  max-width: 1400px; margin: 0 auto;
  display: flex; flex-wrap: wrap;
  align-items: flex-start; justify-content: space-between; gap: var(--space-md);
}
.k1-footer a { color: rgba(240,238,233,0.45); text-decoration: none; }
.k1-footer a:hover { color: var(--mocha-lt); }

/* ── Slide-in drawer ────────────────────────────────── */
.k1-drawer-header {
  background: var(--cd-warm);
  border-bottom: 1px solid var(--border);
}

/* ── Mobile responsive ──────────────────────────────── */
@media (max-width: 767px) {
  .k1-sidebar { display: none; }
  .k1-header-inner { height: auto; padding: 10px var(--space-sm); flex-wrap: wrap; gap: 8px; }

      review_state: rs,
    };
  } catch (err) {
    console.error('Dashboard: Local snapshot load error:', err);
    return null;
  }
}

function downloadJson(filename, payload) {
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

const GUIDELINE_CATEGORIES = [...new Set(GUIDELINES_REGISTRY.map(g => g.category))];

// ── Components ──

function RoleBadge({ roleId }) {
  const cfg = ROLE_CONFIG[roleId] || { label: roleId, color: 'bg-gray-400', textColor: 'text-white' };
  return <span className={`role-badge ${cfg.color} ${cfg.textColor}`}>{cfg.label}</span>;
}

function StatusBadge({ status }) {
  if (status === 'approved') {
    return <span className="status-badge bg-green-100 text-green-700">已確認</span>;
  }
  return <span className="status-badge bg-yellow-100 text-yellow-700">待審核</span>;
}

function FactCard({ fact, index, roleId, topicId, status, sourceRef, onEdit, onDelete, onApprove, onReject, onChangeRole, isAdmin }) {
  const charCount = fact.length;
  const isDraft = status === 'draft';
  return (
    <div className={`fact-card bg-white rounded-lg p-4 border border-gray-200 animate-in ${isDraft ? 'draft' : 'approved'}`}>
      <div className="flex items-start justify-between gap-3">
        <div className="flex-1">
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <StatusBadge status={status} />
            <RoleBadge roleId={roleId} />
            <span className="text-xs text-gray-400">#{index + 1}</span>
            <span className={`text-xs ${charCount > 75 ? 'text-red-500 font-bold' : 'text-gray-400'}`}>
              {charCount}/80字
            </span>
            {sourceRef && (
              <a href={sourceRef.url} target="_blank" rel="noopener"
                 className="text-xs text-amber-600 hover:text-amber-800 underline flex items-center gap-0.5" title={sourceRef.title}>
                <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
                出處
              </a>
            )}
          </div>
          <p className="text-gray-800 text-sm leading-relaxed">{fact}</p>
        </div>
        {isAdmin && (
          <div className="flex gap-1 flex-shrink-0 items-center">
            {/* Approve button */}
            {isDraft && (
              <button onClick={() => onApprove(topicId, roleId, index)}
                      className="approve-btn text-green-500 hover:text-green-700 p-1.5 rounded-full hover:bg-green-50" title="確認通過">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" />
                </svg>
              </button>
            )}
            {/* Revert to draft */}
            {!isDraft && (
              <button onClick={() => onReject(topicId, roleId, index)}
                      className="approve-btn text-yellow-500 hover:text-yellow-700 p-1.5 rounded-full hover:bg-yellow-50" title="退回草稿">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
                </svg>
              </button>
            )}
            {/* Change role */}
            <button onClick={() => onChangeRole(topicId, roleId, index)}
                    className="text-gray-400 hover:text-amber-700 p-1" title="更改角色">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">

function ExportModal({ isOpen, onClose, data, reviewState }) {
  const [exportKind, setExportKind] = useState('approved');

  useEffect(() => {
    if (isOpen) setExportKind('approved');
  }, [isOpen]);

  // Build export data with only approved facts
  const approvedExport = useMemo(() => {
    const out = { _meta: { ...data._meta } };
    let approvedCount = 0;
    let skippedCount = 0;
    Object.entries(data).forEach(([tid, td]) => {
      if (tid === '_meta') return;
      const topicOut = {};
      // Copy meta fields
      Object.entries(td).forEach(([k, v]) => {
        if (k.startsWith('_')) { topicOut[k] = v; return; }
        if (!Array.isArray(v)) return;
        const approved = v.filter((_, i) => reviewState[makeKey(tid, k, i)] === 'approved');
        if (approved.length > 0 || k === 'all_roles') {
          topicOut[k] = approved;
          approvedCount += approved.length;
        }
        skippedCount += v.length - approved.length;
      });
      out[tid] = topicOut;
    });
    return { json: out, approvedCount, skippedCount };
  }, [data, reviewState]);

  const adminSnapshot = useMemo(() => {
    return buildAdminSnapshot(data, reviewState);
  }, [data, reviewState]);

  if (!isOpen) return null;

  const previewJson = exportKind === 'approved'
    ? JSON.stringify(approvedExport.json, null, 2)
    : JSON.stringify(adminSnapshot, null, 2);

  return (
    <div className="fixed inset-0 modal-overlay flex items-center justify-center z-50" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-2xl mx-4 max-h-screen overflow-hidden flex flex-col" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-lg font-bold text-gray-800">匯出與備份</h3>
        </div>

        <div className="mb-3 px-3 py-2 bg-blue-50 border border-blue-200 rounded-lg">

            你在管理員模式的編輯與審批，會自動保存到目前瀏覽器。若要永久寫回 GitHub repo，請下載「管理快照」再回寫。
          </p>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
          <div
            onClick={() => setExportKind('approved')}
            className={`text-left p-4 rounded-xl border cursor-pointer ${exportKind === 'approved' ? 'border-amber-400 bg-orange-50' : 'border-gray-200 bg-white hover:bg-gray-50'}`}>
            <div className="flex items-center justify-between gap-3 mb-2">
              <h4 className="text-sm font-semibold text-gray-800">發布版 role_facts.json</h4>
              <button
                onClick={(e) => {

            <div className="flex gap-2 text-xs">
              <span className="px-2 py-1 bg-green-50 border border-green-200 rounded text-green-700">
                已確認：{approvedExport.approvedCount}
              </span>

                草稿排除：{approvedExport.skippedCount}

          <div

            <p className="text-xs text-gray-600 mb-2">包含完整 `data` 與 `review_state`，用於把 GitHub Pages 上的審批結果永久回寫到 repo。</p>

// ── Admin Password Modal ──
function AdminPasswordModal({ isOpen, onClose, onSuccess }) {
  const [pw, setPw] = useState('');
  const [error, setError] = useState('');
  const [checking, setChecking] = useState(false);

  useEffect(() => { if (isOpen) { setPw(''); setError(''); } }, [isOpen]);
  if (!isOpen) return null;

  const handleSubmit = async (e) => {
    e.preventDefault();
    setChecking(true);
    setError('');
    const hash = await sha256(pw);
    if (hash === ADMIN_HASH) {
      onSuccess();
      onClose();
    } else {
      setError('密碼錯誤，請再試。');
    }
    setChecking(false);
  };

  return (
    <div className="fixed inset-0 modal-overlay flex items-center justify-center z-50">
      <div className="bg-white rounded-xl shadow-xl p-6 w-full max-w-xs mx-4">
        <h3 className="text-base font-bold text-gray-800 mb-1">🔒 管理員登入</h3>
        <p className="text-xs text-gray-500 mb-4">輸入管理員密碼以啟用增刪審批功能</p>
        <form onSubmit={handleSubmit}>
          <input
            type="password"
            value={pw}
            onChange={e => setPw(e.target.value)}
            placeholder="密碼"
            autoFocus
            className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-2 focus:ring-2 focus:ring-amber-200 focus:border-transparent"
          />
          {error && <p className="text-xs text-red-600 mb-2">{error}</p>}
          <div className="flex gap-2 mt-2">
            <button type="button" onClick={onClose}
                    className="flex-1 px-3 py-2 text-sm text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50">
              取消
            </button>
            <button type="submit" disabled={checking || pw.length === 0}
                    style={(checking || pw.length === 0) ? { backgroundColor: 'var(--paper-2)', color: 'var(--ink-3)', border: '1px solid #e5e7eb', cursor: 'not-allowed' } : { backgroundColor: 'var(--edb)', color: '#ffffff' }}
                    className="flex-1 px-3 py-2 text-sm font-bold rounded-lg transition-all focus:outline-none focus:ring-2 focus:ring-amber-200 shadow-sm relative z-10">
              {checking ? '驗證中…' : '確認'}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

function GuidelinesPanel({ setPreviewDoc }) {
  const [activeCat, setActiveCat] = useState('all');
  const [activeLevel, setActiveLevel] = useState('all');
  const [searchQ, setSearchQ] = useState('');
  const [sortBy, setSortBy] = useState('year-desc'); // 'year-desc' | 'year-asc' | 'title'

  const CATS = [
    { key: 'all',   label: '全部',   icon: '📋' },
    { key: '課程',   label: '課程',   icon: '📚' },
    { key: '財務採購', label: '財務採購', icon: '💰' },
    { key: '人力資源', label: '人力資源', icon: '👥' },
    { key: '學生事務', label: '學生事務', icon: '🎒' },
    { key: '學生安全', label: '學生安全', icon: '🛡️' },
    { key: '安全',   label: '科目安全', icon: '⚠️' },
    { key: '活動',   label: '活動',   icon: '🏃' },
    { key: '津貼',   label: '津貼',   icon: '🏷️' },
    { key: '行政',   label: '行政',   icon: '🏫' },
    { key: '資訊科技', label: '資訊科技', icon: '💻' },
  ];

  const catCounts = useMemo(() => {
    const counts = { all: GUIDELINES_REGISTRY.length };
    GUIDELINES_REGISTRY.forEach(g => { counts[g.category] = (counts[g.category] || 0) + 1; });
    return counts;
  }, []);

  const LEVELS = ['幼稚園', '小學', '中學', '特殊', '跨階段'];

  // Sub-category display labels
  const SUB_CAT_LABELS = {
    procurement: '採購程序', lsg: '法團校董會',
    leave: '請假安排', conduct: '專業操守',
    general: '整體課程指引', language: '語文教育',
    math_science: '數理科學及科技', humanities: '人文社會科學',
    values: '價值觀及公民教育', arts_pe: '藝術及體育',
    ph_primary: '小學人文科', pri_science: '小學科學科',
    sen_gifted: '特殊及資優教育', safety: '科目安全指引',
    admin: '行政安排', grant: '津貼及資源', activity: '學校活動',
    discipline: '訓育及輔導', sen: '融合教育',
    security: '資訊保安', kindergarten: '幼稚園', stat: '統計數字',
  };

  // Preferred sub-category order per main category
  const SUB_CAT_SEQ = {
    '財務採購': ['lsg','procurement'],
    '人力資源': ['leave','conduct','stat'],
    '課程':     ['general','language','math_science','pri_science','ph_primary','humanities','values','arts_pe','sen_gifted','safety','admin','stat'],
    '活動':     ['grant','activity'],
    '學生事務': ['discipline','sen','safety','stat'],
    '資訊科技': ['security'],
    '行政':     ['admin','kindergarten'],
  };

  const filtered = useMemo(() => {
    let list = GUIDELINES_REGISTRY.filter(g => {
      if (activeCat !== 'all' && g.category !== activeCat) return false;
      if (activeCat === '課程' && activeLevel !== 'all' && g.level !== activeLevel) return false;
      if (searchQ && !g.title.includes(searchQ) && !g.titleShort.includes(searchQ)) return false;
      return true;
    });
    if (sortBy === 'year-desc') list = [...list].sort((a, b) => parseInt(b.year) - parseInt(a.year));
    else if (sortBy === 'year-asc') list = [...list].sort((a, b) => parseInt(a.year) - parseInt(b.year));
    else if (sortBy === 'title') list = [...list].sort((a, b) => a.title.localeCompare(b.title, 'zh-HK'));
    return list;
  }, [activeCat, activeLevel, searchQ, sortBy]);

  // Grouped view: when a specific category is active and no search query
  const groupedView = useMemo(() => {
    if (activeCat === 'all' || searchQ) return null;
    const bySubCat = {};
    filtered.forEach(g => {
      const key = g.sub_category || 'other';
      if (!bySubCat[key]) bySubCat[key] = [];
      bySubCat[key].push(g);
    });
    // Sort each group year desc
    Object.values(bySubCat).forEach(arr => arr.sort((a, b) => parseInt(b.year) - parseInt(a.year)));
    const seq = SUB_CAT_SEQ[activeCat] || [];
    const groups = [];
    seq.forEach(sc => { if (bySubCat[sc]) groups.push({ key: sc, label: SUB_CAT_LABELS[sc] || sc, items: bySubCat[sc] }); });
    Object.keys(bySubCat).forEach(sc => { if (!seq.includes(sc)) groups.push({ key: sc, label: SUB_CAT_LABELS[sc] || sc, items: bySubCat[sc] }); });
    return groups;
  }, [activeCat, filtered, searchQ]);

  const activeCatLabel = CATS.find(c => c.key === activeCat)?.label || '全部';

  const formatBadge = (fmt) => {
    if (fmt === 'PDF') return { bg: 'bg-orange-100', text: 'text-amber-900', border: 'border-orange-200' };
    if (fmt === 'HTML') return { bg: 'bg-stone-100', text: 'text-stone-700', border: 'border-stone-200' };
    return { bg: 'bg-gray-50', text: 'text-gray-600', border: 'border-gray-200' };
  };

  // Use light backgrounds + dark text so year is always legible regardless of card border color
  const yearColor = (yr) => {
    const y = parseInt(yr);
    if (!yr || isNaN(y)) return 'bg-gray-100 text-gray-500';
    if (y >= 2024) return 'bg-orange-100 text-amber-900 font-extrabold';
    if (y >= 2020) return 'bg-gray-100 text-gray-600 font-bold';
    if (y >= 2015) return 'bg-amber-100 text-amber-800';
    return 'bg-gray-100 text-gray-500';
  };

  const levelColors = {
    '幼稚園': 'bg-orange-50 text-amber-900 border border-orange-200',
    '小學':   'bg-stone-50 text-stone-700 border border-stone-200',
    '中學':   'bg-amber-50 text-amber-900 border border-amber-200',
    '特殊':   'bg-stone-100 text-stone-800 border border-stone-300',
    '跨階段': 'bg-gray-50 text-gray-600 border border-gray-200',
  };

  return (
    <div className="flex-1 min-w-0 flex gap-4">
      {/* ── Left sidebar: category nav ── */}
      <div className="w-44 flex-shrink-0">
        <div className="bg-white rounded-xl border border-gray-200 overflow-hidden sticky top-4">
          <div className="px-4 py-3 border-b border-gray-100">
            <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide">分類</p>
          </div>
          <nav className="py-1">
            {CATS.filter(c => c.key === 'all' || catCounts[c.key]).map(cat => (
              <button key={cat.key} onClick={() => { setActiveCat(cat.key); setActiveLevel('all'); }}
                className={`w-full flex items-center justify-between px-4 py-2.5 text-sm transition-all
                  ${activeCat === cat.key
                    ? 'bg-amber-800 text-white font-semibold shadow-md'
                    : 'text-gray-700 hover:bg-gray-50'}`}>
                <span className="flex items-center gap-2">
                  <span className="text-base leading-none">{cat.icon}</span>
                  <span>{cat.label}</span>
                </span>
                <span className={`text-xs font-medium px-1.5 py-0.5 rounded-full min-w-5 text-center
                  ${activeCat === cat.key ? 'bg-amber-900 text-amber-100' : 'bg-gray-100 text-gray-500'}`}>
                  {catCounts[cat.key] || 0}
                </span>
              </button>
            ))}
          </nav>
        </div>
      </div>

      {/* ── Right: header + cards ── */}
      <div className="flex-1 min-w-0">
        {/* Toolbar */}
        <div className="bg-white rounded-xl border border-gray-200 p-4 mb-3">
          <div className="flex flex-wrap items-center gap-3 mb-3">
            <div className="flex-1 min-w-0">
              <h2 className="text-base font-bold text-gray-800">
                {activeCat === 'all' ? '全部指引文件' : activeCatLabel}
                <span className="ml-2 text-sm font-normal text-gray-400">({filtered.length} 份)</span>
              </h2>
            </div>
            <input type="text" value={searchQ} onChange={e => setSearchQ(e.target.value)}
                   placeholder="搜尋名稱..."
                   className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm w-44 focus:ring-2 focus:ring-amber-200 focus:border-transparent" />
            <div className="flex items-center gap-1 border border-gray-200 bg-gray-50 rounded-lg p-1 text-xs shadow-inner">
              {[
                { val: 'year-desc', label: '最新' },
                { val: 'year-asc',  label: '最舊' },
                { val: 'title',     label: '名稱' },
              ].map(s => (
                <button key={s.val} onClick={() => setSortBy(s.val)}
                  className={`px-3 py-1.5 font-medium rounded-md transition-all

                      : 'text-gray-500 hover:text-gray-800 hover:bg-gray-200/50'}`}>
                  {s.label}

          {/* Level filter — shown only for 課程 category */}

function SourcesAccordion({ results, topicLabels }) {
  const [open, setOpen] = React.useState(false);

  // Group chunks by source document; chunks without URL → single "已核實政策事實" group
  const NO_URL_KEY = '__approved_facts__';
  const docMap = {};
  results.forEach(item => {
    const hasUrl = item.sourceRef && item.sourceRef.url;
    const key = hasUrl ? item.sourceRef.url : NO_URL_KEY;
    if (!docMap[key]) {
      docMap[key] = {
        title: hasUrl ? item.sourceRef.title : '已核實政策事實',
        url: hasUrl ? item.sourceRef.url : null,
        topic: item.topicId,
        chunks: [],
        bestScore: 0,
        isApprovedFacts: !hasUrl,
      };
    }
    docMap[key].chunks.push(item);
    if (item.score > docMap[key].bestScore) docMap[key].bestScore = item.score;
  });

  const docs = Object.values(docMap).sort((a, b) => b.bestScore - a.bestScore);
  const totalChunks = results.length;

  return (
    <div style={{border:'1px solid var(--line)',borderRadius:'var(--r-md)',overflow:'hidden'}}>
      <button onClick={() => setOpen(v => !v)}
        style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',
                padding:'10px 14px',background:'var(--paper-2)',border:'none',cursor:'pointer',
                fontSize:'var(--text-xs)',color:'var(--ink-3)'}}>
        <span>📎 參考來源 · {docs.length} 份文件，{totalChunks} 個片段</span>
        <span style={{transform:open?'rotate(180deg)':'none',transition:'transform .2s'}}>▾</span>
      </button>
      {open && (
        <div style={{background:'var(--paper-2)'}}>
          {docs.map((doc, di) => (
            <div key={di}
                 style={{display:'flex',alignItems:'flex-start',gap:'10px',
                         padding:'9px 14px',
                         borderTop: di === 0 ? 'none' : '1px solid #F0EDE9'}}>
              <span style={{fontSize:'14px',marginTop:'1px',flexShrink:0}}>
                {doc.isApprovedFacts ? '✅' : '📄'}
              </span>
              <div style={{flex:1,minWidth:0}}>
                {doc.url ? (
                  <a href={doc.url} target="_blank" rel="noopener"
                     style={{fontSize:'var(--text-xs)',fontWeight:600,color:'var(--ink)',
                             textDecoration:'none',display:'block',
                             overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {doc.title}
                  </a>
                ) : (
                  <span style={{fontSize:'var(--text-xs)',fontWeight:600,
                                color: doc.isApprovedFacts ? 'var(--edb)' : 'var(--ink)'}}>
                    {doc.title}
                  </span>
                )}
                <span style={{fontSize:'10px',color:'var(--ink-3)'}}>
                  {doc.chunks.length} 個片段 · 最高相關度 {doc.bestScore.toFixed(2)}
                  {(() => {
                    const pages = [...new Set(doc.chunks.map(c => c.page).filter(Boolean))].sort((a,b)=>a-b);
                    return pages.length > 0 ? ` · 頁 ${pages.join(', ')}` : '';
                  })()}
                </span>
              </div>
              {doc.url && (
                <a href={doc.url} target="_blank" rel="noopener"
                   style={{fontSize:'10px',color:'var(--edb)',textDecoration:'none',
                           flexShrink:0,marginTop:'2px'}}>
                  ↗ 開啟
                </a>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );

function QAPanel({ data, setPreviewDoc }) {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);
  const [synthesis, setSynthesis] = useState(null);
  const [searched, setSearched] = useState(false);
  const [qaRole, setQaRole] = useState('all_roles');
  const [searchChannel, setSearchChannel] = useState('A'); // 'A' | 'B' | 'AB'
  const [isLoading, setIsLoading] = useState(false);
  const [backendError, setBackendError] = useState(null);

  const BACKEND_URL = 'https://edb-knowledge.onrender.com';
  const TOPIC_LABELS = {
    finance: '財務/採購', hr: '人力資源', curriculum: '課程',
    activity: '活動', student: '學生事務', it: '資訊科技', general: '通用/行政'
  };

  // Channel A: backend semantic search over approved facts (with synthesis)
  const runChannelA = useCallback(async (q, targetRole) => {
    const body = {
      query: q,
      min_score: 0.1,
      synthesize: true,
      ...(targetRole !== 'all_roles' ? { role: targetRole } : {}),
    };
    const resp = await fetch(`${BACKEND_URL}/api/search/channel-a`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if (!resp.ok) throw Object.assign(new Error(`HTTP ${resp.status}`), { status: resp.status });
    const json = await resp.json();
    setSynthesis(json.synthesis || null);
    return (json.results || []).map(r => ({
      topicId: r.topic || 'general',
      roleId: r.role || 'all_roles',
      fact: r.text, index: 0,
      sourceRef: null,
      score: r.score, channel: 'A',
    }));
  }, []);

  // Channel B: backend semantic search (requires backend running)
  const runChannelB = useCallback(async (q) => {
    const resp = await fetch(`${BACKEND_URL}/api/search/channel-b`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ query: q, min_score: 0.15, top_k: 8 })
    });
    if (!resp.ok) throw Object.assign(new Error(`HTTP ${resp.status}`), { status: resp.status });
    const json = await resp.json();
    setSynthesis(json.synthesis || null);
    return (json.results || []).map(r => ({
      topicId: r.topic || 'general', roleId: r.role || 'all_roles',
      fact: r.text, index: 0,
      sourceRef: r.url ? { url: r.url, title: r.title } : null,
      score: r.score, channel: 'B',
      content_type: r.content_type, fact_type: r.fact_type,
    }));
  }, []);

  // A+B: combined backend search
  const runCombined = useCallback(async (q) => {
    const resp = await fetch(`${BACKEND_URL}/api/search/combined`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ query: q, min_score: 0.15, top_k: 8 })
    });
    if (!resp.ok) throw Object.assign(new Error(`HTTP ${resp.status}`), { status: resp.status });
    const json = await resp.json();
    setSynthesis(json.synthesis || null);
    return (json.results || []).map(r => ({
      topicId: r.topic || r.topicId || 'general',
      roleId: r.role || r.roleId || 'all_roles',
      fact: r.text || r.fact, index: 0,
      sourceRef: r.url ? { url: r.url, title: r.title } : (r.sourceRef || null),
      score: r.score, channel: r.channel || 'B',
      content_type: r.content_type,
      page: r.page,
    }));
  }, []);

  const handleSearch = useCallback(async () => {
    const trimmed = query.trim();
    if (!trimmed) return;
    setIsLoading(true);
    setBackendError(null);
    try {
      let found = [];
      if (searchChannel === 'A') {
        found = await runChannelA(trimmed, qaRole);
      } else if (searchChannel === 'B') {
        found = await runChannelB(trimmed);
      } else {
        found = await runCombined(trimmed);
      }
      setResults(found);
      setSearched(true);
    } catch (err) {
      if (err && err.status === 429) {
        setBackendError('查詢次數已達上限（每分鐘10次），請稍候約1分鐘後再試。');
      } else {
        setBackendError('搜尋服務暫未連線，請稍後再試。');
      }
      setResults([]);
      setSearched(true);
    } finally {
      setIsLoading(false);
    }
  }, [query, qaRole, searchChannel, runChannelA, runChannelB, runCombined]);

  const handleClear = () => { setQuery(''); setResults([]); setSynthesis(null); setSearched(false); setBackendError(null); };

  const highlightFact = (fact, tokens) => {
    if (!tokens || tokens.length === 0 || searchChannel !== 'A') return fact;
    const pattern = tokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
    const parts = fact.split(new RegExp(`(${pattern})`, 'g'));
    return parts.map((part, i) =>
      tokens.includes(part) ? <mark key={i} className="qa-highlight">{part}</mark> : part
    );
  };

  const tokens = (searched && searchChannel === 'A') ? query.trim().split(/[\s，,、]+/).filter(t => t.length > 0) : [];

  const channelACount = Object.entries(data).filter(([k]) => k !== '_meta')
    .reduce((s, [, td]) => s + ROLE_ORDER.reduce((n, r) => n + (Array.isArray(td[r]) ? td[r].length : 0), 0), 0);

  const getChannelBadge = (ch, ct) => {
    if (ch === 'A') return { bg: 'var(--edb-wash)', color: 'var(--edb)', label: '通道 A · 已核實' };
    if (ct === 'approved_fact') return { bg: 'var(--edb-wash)', color: 'var(--edb)', label: '通道 B · 已核實' };
    if (ct === 'stat_fact') return { bg: 'var(--edb-wash)', color: 'var(--ink-2)', label: '通道 B · 統計' };
    return { bg: 'var(--paper-2)', color: 'var(--edb)', label: '通道 B · 文件' };
  };

  const CHANNEL_OPTS = [

          <p style={{fontSize:'var(--text-sm)',color:'var(--mid)'}}>輸入問題或關鍵詞開始搜尋</p>
        </div>
      ) : results.length === 0 && !backendError ? (
        <div className="bg-white rounded-xl border border-gray-200 p-10 text-center">
          <p className="text-3xl mb-3">🤷</p>

            <div style={{background:'var(--paper-2)',border:'1px solid #C4A882',borderRadius:'var(--r-md)',padding:'14px 16px'}}>

                </span>

                  {searchChannel === 'A' ? '已核實事實摘要' : '來源文件摘要'}
                </span>
              </div>
              <p style={{fontSize:'var(--text-sm)',color:'var(--ink)',lineHeight:1.7,margin:0}}>{synthesis}</p>
            </div>
          )}
          {/* Channel B with synthesis: show sources as collapsed strip */}
          {synthesis && results.filter(r => r.channel === 'B').length > 0 && (
            <SourcesAccordion results={results.filter(r => r.channel === 'B')} topicLabels={TOPIC_LABELS} />
          )}
          {/* Channel B / Combined disclaimer */}
          {(searchChannel === 'B' || searchChannel === 'AB') && results.length > 0 && (
            <div style={{display:'flex',alignItems:'flex-start',gap:'8px',padding:'10px 12px',background:'#FFFBEB',border:'1px solid #FCD34D',borderRadius:'var(--r-md)',fontSize:'var(--text-xs)',color:'#92400E',lineHeight:1.6}}>
              <span style={{flexShrink:0,marginTop:'1px'}}>⚠️</span>
              <span>來源文件搜尋結果由 AI 語義搜尋生成，<strong>行政及財務類查詢</strong>（如採購門檻、請假程序）結果準確性待確認，建議對照<a href="https://www.edb.gov.hk" target="_blank" rel="noopener noreferrer" style={{color:'#92400E',textDecoration:'underline'}}>教育局官方原文</a>核實。</span>
            </div>
          )}
          {/* Channel A results or Channel B without synthesis: full cards (deduped) */}
          {(() => {
            const seen60 = new Set();
            return results.filter(r => r.channel === 'A' || !synthesis).filter(item => {
              const key = (item.fact || '').slice(0, 60);
              if (seen60.has(key)) return false;
              seen60.add(key);
              return true;
            });
          })().map((item, i) => {
            const badge = getChannelBadge(item.channel, item.content_type);
            return (
              <div key={i} className="qa-result-card bg-white rounded-lg p-4 border border-gray-200 animate-in">
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <span className="text-xs px-2 py-0.5 rounded-full font-bold border"
                        style={{background:badge.bg,color:badge.color,borderColor:badge.color+'33'}}>
                    {badge.label}
                  </span>
                  <span className="text-xs px-2 py-0.5 rounded-full bg-orange-50 text-amber-900 font-bold border border-orange-200">
                    {TOPIC_LABELS[item.topicId] || item.topicId}
                  </span>
                  {item.channel === 'A' && <RoleBadge roleId={item.roleId} />}
                  {item.channel === 'B' && typeof item.score === 'number' && (
                    <span className="text-xs text-gray-400 ml-auto">相關度 {item.score.toFixed(2)}</span>
                  )}
                </div>
                <p className="text-sm text-gray-800 mb-2">{highlightFact(item.fact, tokens)}</p>
                {item.sourceRef && (
                  <a href={item.sourceRef.url} target="_blank" rel="noopener"
                     className="source-link inline-flex items-center gap-1">
                    <svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                    {item.sourceRef.title}
                  </a>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── Circular Analysis Panel ──
function CircularAnalysisPanel() {
  const BACKEND_URL = 'https://edb-knowledge.onrender.com/analyze-circular';

  const [circularText, setCircularText] = useState('');
  const [role, setRole] = useState('principal');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);

  const TOPIC_LABELS = {
    finance: '財務/採購', hr: '人力資源', curriculum: '課程',
    activity: '活動', student: '學生事務', it: '資訊科技', general: '通用/行政'
  };

  const ROLE_OPTIONS = [
    { value: 'principal',       label: '校長' },
    { value: 'vice_principal',  label: '副校長' },
    { value: 'panel_chair',  label: '主任' },
    { value: 'subject_head', label: '科主任' },
    { value: 'teacher',         label: '教師' },
    { value: 'eo_admin',        label: 'EO' },
    { value: 'supplier',        label: '供應商' },
    { value: 'all_roles',       label: '全部角色' },
  ];

  const handleAnalyze = async () => {
    if (!circularText.trim()) return;
    setLoading(true);
    setError(null);
    setResult(null);
    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ circular_text: circularText, role }),
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      setResult(body);
    } catch (err) {
      setError(err.message || '分析服務暫未連線；請稍後再試，或先使用政策搜尋。');
    } finally {
      setLoading(false);
    }
  };

  const handleClear = () => { setResult(null); setError(null); };

  return (
    <div className="flex-1 min-w-0">
      {/* Input card */}
      <div className="bg-white rounded-xl border border-gray-200 p-5 mb-4">
        <h2 className="text-lg font-bold text-gray-800 mb-1">通告分析</h2>
        <p className="text-xs text-gray-400 mb-1">
          貼上通告全文，選擇角色，平台會偵測相關主題並整理顧問式分析。
        </p>
        <p className="text-xs text-gray-300 mb-4">
          此功能需要本機分析服務連線；未啟用時可先使用政策搜尋。
        </p>
        <textarea
          value={circularText}
          onChange={e => setCircularText(e.target.value)}
          placeholder="貼上通告全文…"
          rows={7}
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-200 focus:border-transparent resize-y mb-3 font-mono" />
        <div className="flex items-center gap-3 flex-wrap">
          <select
            value={role}
            onChange={e => setRole(e.target.value)}
            className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-amber-200 focus:border-transparent">
            {ROLE_OPTIONS.map(opt => (
              <option key={opt.value} value={opt.value}>{opt.label}</option>
            ))}
          </select>
          <button
            onClick={handleAnalyze}
            disabled={loading || !circularText.trim()}
            style={{ background: 'var(--p-primary)' }}
            className="px-4 py-1.5 text-white text-sm rounded-lg hover:opacity-90 font-medium disabled:opacity-40 disabled:cursor-not-allowed transition-all">
            {loading ? '分析中…' : '開始分析'}
          </button>
          {(result || error) && (
            <button onClick={handleClear}
                    className="px-3 py-1.5 text-xs text-gray-400 hover:text-gray-600 border border-gray-200 rounded-lg">
              清除結果
            </button>
          )}
        </div>
      </div>

      {/* Loading */}
      {loading && (
        <div className="bg-white rounded-xl border border-gray-200 p-10 text-center text-gray-400">
          <p className="text-3xl mb-3" style={{animation:'pulse 1.5s ease-in-out infinite'}}>⚙️</p>
          <p className="text-sm">正在整理通告內容，請稍候…</p>
        </div>
      )}

      {/* Error */}
      {!loading && error && (
        <div className="bg-red-50 rounded-xl border border-red-200 p-5">
          <p className="text-sm font-medium text-red-700 mb-1">連接錯誤</p>
          <p className="text-sm text-red-600">{error}</p>
          <p className="mt-2 text-xs text-red-400">
            分析服務暫未連線；請稍後再試，或先使用政策搜尋。
          </p>
        </div>
      )}

      {/* Results */}
      {!loading && result && (
        <div className="space-y-4">
          {/* Detected topics */}
          <div className="bg-white rounded-xl border border-gray-200 p-4">
            <h3 className="text-sm font-semibold text-gray-700 mb-2">🎯 偵測主題</h3>
            <div className="flex flex-wrap gap-2">
              {result.detected_topics.length === 0 ? (
                <span className="text-xs text-gray-400">未偵測到特定主題</span>
              ) : result.detected_topics.map(t => (
                <span key={t} className="text-xs px-2.5 py-1 rounded-full bg-orange-50 text-amber-900 border border-orange-200 font-bold">
                  {TOPIC_LABELS[t] || t}
                </span>
              ))}
            </div>
          </div>

          {/* Used facts */}
          <div className="bg-white rounded-xl border border-gray-200 p-4">
            <h3 className="text-sm font-semibold text-gray-700 mb-2">
              📋 注入知識 <span className="font-normal text-gray-400">({result.used_facts.length} 條)</span>
            </h3>
            {result.used_facts.length === 0 ? (
              <p className="text-xs text-gray-400">無相關已確認知識可注入</p>
            ) : (
              <ul className="space-y-1.5">
                {result.used_facts.map((fact, i) => (
                  <li key={i} className="text-xs text-gray-600 flex items-start gap-1.5">
                    <span className="text-amber-400 mt-0.5 flex-shrink-0">•</span>
                    {fact}
                  </li>
                ))}
              </ul>
            )}
          </div>

          {/* Analysis */}
          <div className="bg-white rounded-xl border border-gray-200 p-4">
            <h3 className="text-sm font-semibold text-gray-700 mb-2">💡 顧問式分析</h3>
            <div className="text-sm text-gray-800 whitespace-pre-wrap leading-relaxed">{result.analysis}</div>
          </div>
        </div>
      )}

      {/* Empty state */}
      {!loading && !result && !error && (
        <div className="bg-white rounded-xl border border-gray-200 p-10 text-center">
          <p className="text-4xl mb-3">📋</p>
          <p className="text-sm text-gray-400">貼上 EDB 通告，整理相關 EDB 規定及跟進建議</p>
          <p className="text-xs text-gray-300 mt-1">未連線時可先使用政策搜尋查找來源</p>
        </div>
      )}
    </div>
  );
}
