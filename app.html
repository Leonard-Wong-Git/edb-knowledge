function CandidateReviewPanel({ queue, onApprove, onReject }) {
  const [selectedId, setSelectedId] = useState(queue[0]?.id || null);
  const selected = queue.find(c => c.id === selectedId) || queue[0] || null;
  const [editableText, setEditableText] = useState(selected?.proposed_text || '');
  const [selectedRoles, setSelectedRoles] = useState(selected?.suggested_roles || []);

  useEffect(() => {
    if (!selected && queue.length > 0) {
      setSelectedId(queue[0].id);
    }
  }, [queue, selected]);

  useEffect(() => {
    if (!selected) return;
    setEditableText(selected.proposed_text || '');
    setSelectedRoles(selected.suggested_roles || []);
  }, [selected?.id]);

  if (queue.length === 0) {
    return (
      <div className="review-empty flex-1 min-w-0">
        <p className="text-lg font-semibold text-gray-700">候選隊列已清空</p>
        <p className="text-sm mt-1">目前沒有候選知識點需要審核。</p>
      </div>
    );
  }

  const toggleRole = (roleId) => {
    setSelectedRoles(prev => (
      prev.includes(roleId) ? prev.filter(r => r !== roleId) : [...prev, roleId]
    ));
  };
  const edited = selected && editableText !== selected.proposed_text;
  const approveSelected = () => {
    if (!selected || selectedRoles.length === 0) return;
    onApprove({ ...selected, proposed_text: editableText, suggested_roles: selectedRoles });
  };

  return (
    <div className="review-workspace flex-1 min-w-0">
      <section className="review-list">
        <div className="review-head">
          <div>
            <h2>知識提煉</h2>
            <p>逐條核對候選事實，右側即時修訂與確認。</p>
          </div>
          <span className="review-metric">{queue.length} 待審</span>
        </div>
        {queue.map((cand, idx) => (
          <button key={cand.id}
                  type="button"
                  onClick={() => setSelectedId(cand.id)}
                  className={`candidate-row ${selected?.id === cand.id ? 'active' : ''}`}>
            <span className="candidate-row-top">
              <span className="candidate-topic">{cand.suggested_topic || '通用'} · #{idx + 1}</span>
              <span className="candidate-source">{cand.source_id || cand.source_title || '來源'}</span>
            </span>
            <span className="candidate-text">{cand.proposed_text}</span>
            <span className="candidate-roles">
              {(cand.suggested_roles || ['all_roles']).map(roleId => (
                <span key={roleId} className="candidate-role-pill">{ROLE_CONFIG[roleId]?.label || roleId}</span>
              ))}
            </span>
          </button>
        ))}
      </section>

      <aside className="review-inspector">
        <div>
          <div className="inspector-label">已選候選</div>
          <div className="inspector-title">{selected?.source_id || selected?.id}</div>
        </div>

        <div>
          <div className="inspector-label mb-2">候選事實</div>
          <textarea className="review-editor"
                    value={editableText}
                    onChange={e => setEditableText(e.target.value)}
                    aria-label="修訂候選事實" />
          <div className="mt-1 text-xs text-gray-400">
            {editableText.length}/80 字 {edited && <span className="text-amber-700 ml-2">已修訂</span>}
          </div>
        </div>

        <div>
          <div className="inspector-label mb-2">適用角色</div>
          <div className="role-toggle-grid">
            {Object.entries(ROLE_CONFIG).map(([roleId, cfg]) => (
              <button key={roleId}
                      type="button"
                      onClick={() => toggleRole(roleId)}
                      className={`role-toggle ${selectedRoles.includes(roleId) ? 'active' : ''}`}>
                {cfg.label}
              </button>
            ))}
          </div>
        </div>

        <div>
          <div className="inspector-label mb-2">原文證據</div>
          <div className="inspector-box">
            <div style={{whiteSpace:'pre-wrap'}}>{selected?.source_quote || '未提供原文摘錄'}</div>
            <div className="mt-3 text-xs text-gray-500">
              出處：{selected?.source_url ? (
                <a href={selected.page_number ? `${selected.source_url}#page=${selected.page_number}` : selected.source_url}
                   target="_blank" rel="noreferrer" className="source-link">
                  {selected.source_title || selected.source_id}
                </a>
              ) : (selected?.source_title || selected?.source_id || '未知')}
              {selected?.page_number && <span> · 第 {selected.page_number} 頁</span>}
            </div>
          </div>
        </div>

        <div className="inspector-actions">
          <button type="button" className="review-btn danger" onClick={() => selected && onReject(selected.id)}>
            剔除
          </button>
          <button type="button" className="review-btn" onClick={() => selected && setEditableText(selected.proposed_text)}>
            還原
          </button>
          <button type="button" className="review-btn primary" disabled={!selected || selectedRoles.length === 0} onClick={approveSelected}>
            {edited ? '確認修改並通過' : '確認通過'}
          </button>
        </div>
      </aside>
    </div>
  );
}

// ── Main App ──
function App() {
  const initialData = INITIAL_DATA;
  const [data, setData] = useState(() => {
    const snapshot = loadLocalSnapshot();
    if (snapshot?.data) {
      snapshot.data._meta = deepClone(initialData._meta);
      return snapshot.data;
    }
    return deepClone(initialData);
  });
  const [reviewState, setReviewState] = useState(() => {
    const snapshot = loadLocalSnapshot();
    return snapshot?.review_state || deepClone(INITIAL_REVIEW_STATE);
  });
  const [activeTopic, setActiveTopic] = useState('finance');
  const [filterRole, setFilterRole] = useState('all');
  const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'draft' | 'approved'
  const [editModal, setEditModal] = useState({ isOpen: false, editData: null });
  const [exportModal, setExportModal] = useState(false);
  const [searchQuery, setSearchQuery] = useState('');
  const [viewMode, setViewMode] = useState('qa'); // 'qa' | 'guidelines' | 'knowledge' | 'review'
  const [adminMode, setAdminMode] = useState(false);
  const [showAdminModal, setShowAdminModal] = useState(false);
  const [previewDoc, setPreviewDoc] = useState(null);
  // Fallback chain: dynamically loaded EXTERNAL -> local mock -> empty
  const getInitialQueue = () => {
    try {
      const externalQueue = window.EXTERNAL_CANDIDATES || (typeof INITIAL_CANDIDATES !== 'undefined' ? INITIAL_CANDIDATES : []);
      const processed = JSON.parse(localStorage.getItem('k1_processed_candidates') || '[]');
      return externalQueue.filter(cand => !processed.includes(cand.id));
    } catch {
      return [];
    }
  };
  const [candidateQueue, setCandidateQueue] = useState(getInitialQueue());

  // Policy Signals — count pending_review signals for badge
  const pendingSignalCount = (() => {
    try {
      const ps = window.POLICY_SIGNALS;
      if (!ps || !Array.isArray(ps.signals)) return 0;
      return ps.signals.filter(s => s.status === 'pending_review').length;
    } catch { return 0; }
  })();
  const handleApproveCandidate = useCallback((cand) => {
    const roles = cand.suggested_roles?.length > 0 ? cand.suggested_roles : ['all_roles'];
    const targetTopic = cand.suggested_topic || 'general';
    const factText = cand.proposed_text;
    
    const markProcessed = (id) => {
      try {
        const processed = JSON.parse(localStorage.getItem('k1_processed_candidates') || '[]');
        if (!processed.includes(id)) {
          processed.push(id);
          localStorage.setItem('k1_processed_candidates', JSON.stringify(processed));
        }
      } catch (e) {
        console.warn('Failed to mark candidate processed', e);
      }
    };

    setData(prevData => {
      const nextData = JSON.parse(JSON.stringify(prevData));
      const topicKey = nextData[targetTopic] ? targetTopic : 'general';
      const newReviewStates = {};
      
      roles.forEach(role => {
        if (!nextData[topicKey][role]) nextData[topicKey][role] = [];
        const newIdx = nextData[topicKey][role].length;
        nextData[topicKey][role].push(factText);
        newReviewStates[makeKey(topicKey, role, newIdx)] = 'approved';
      });
      
      nextData._meta.updated = new Date().toISOString().split('T')[0];
      
      setReviewState(prevRev => ({ ...prevRev, ...newReviewStates }));
      return nextData;
    });
    setCandidateQueue(prev => prev.filter(c => c.id !== cand.id));
    markProcessed(cand.id);
  }, []);

  const handleRejectCandidate = useCallback((id) => {
    setCandidateQueue(prev => prev.filter(c => c.id !== id));
    try {
      const processed = JSON.parse(localStorage.getItem('k1_processed_candidates') || '[]');
      if (!processed.includes(id)) {
        processed.push(id);
        localStorage.setItem('k1_processed_candidates', JSON.stringify(processed));
      }
    } catch (e) {}
  }, []);

  const displayVersion = useMemo(() => {
    return `v${data._meta?.version || '0.0.0'}`;
  }, [data]);

  useEffect(() => {
    try {
      localStorage.setItem(
        LOCAL_SNAPSHOT_KEY,
        JSON.stringify(buildAdminSnapshot(data, reviewState))
      );
    } catch (error) {
      console.warn('Failed to persist local admin snapshot:', error);
    }
  }, [data, reviewState]);

  // Stats
  const stats = useMemo(() => {
    let totalFacts = 0; let topicCount = 0; const rolesUsed = new Set();
    let draftCount = 0; let approvedCount = 0;
    Object.entries(data).forEach(([k, v]) => {
      if (k === '_meta') return;
      topicCount++;
      Object.entries(v).forEach(([rk, fs]) => {
        if (rk.startsWith('_')) return;
        rolesUsed.add(rk);
        if (Array.isArray(fs)) {
          totalFacts += fs.length;
          fs.forEach((_, i) => {
            const s = reviewState[makeKey(k, rk, i)];
            if (s === 'draft') draftCount++;
            else approvedCount++;
          });
        }
      });
    });
    return { totalFacts, topicCount, rolesUsed: rolesUsed.size, draftCount, approvedCount };
  }, [data, reviewState]);

  // Topic list
  const topics = useMemo(() => {
    return Object.entries(data)
      .filter(([k]) => k !== '_meta')
      .map(([id, td]) => {
        let factCount = 0; let draftCount = 0;
        Object.entries(td).filter(([k]) => !k.startsWith('_')).forEach(([rk, fs]) => {
          if (!Array.isArray(fs)) return;
          factCount += fs.length;
          fs.forEach((_, i) => {
            if (reviewState[makeKey(id, rk, i)] === 'draft') draftCount++;
          });
        });
        return { id, label: td._label || id, factCount, draftCount };
      });
  }, [data, reviewState]);

  // Current topic data
  const currentTopic = data[activeTopic] || {};

  // Filtered facts
  const filteredFacts = useMemo(() => {
    const result = [];
    ROLE_ORDER.forEach(roleId => {
      if (filterRole !== 'all' && filterRole !== roleId) return;
      const facts = currentTopic[roleId];
      if (!Array.isArray(facts)) return;
      facts.forEach((fact, idx) => {
        if (searchQuery && !fact.includes(searchQuery)) return;
        const status = reviewState[makeKey(activeTopic, roleId, idx)] || 'approved';
        if (filterStatus !== 'all' && filterStatus !== status) return;
        // Resolve source reference
        const srcMap = currentTopic._sourceMap || {};
        const srcIdx = srcMap[`${roleId}.${idx}`];
        const sourceRef = (srcIdx !== undefined && currentTopic._sources?.[srcIdx])
          ? currentTopic._sources[srcIdx] : null;
        result.push({ roleId, fact, index: idx, status, sourceRef });
      });
    });
    return result;
  }, [currentTopic, filterRole, filterStatus, searchQuery, activeTopic, reviewState]);

  // Draft count for current topic
  const currentDraftCount = useMemo(() => {
    return filteredFacts.filter(f => f.status === 'draft').length;
  }, [filteredFacts]);

  const handleReset = useCallback(() => {
    if (!confirm('確定重設並清除所有本地備份？所有未匯出的審核狀態將會消失，並恢復至原始 INITIAL_DATA。')) return;
    localStorage.removeItem(LOCAL_SNAPSHOT_KEY);
    window.location.reload();
  }, []);

  // CRUD handlers
  const handleEdit = useCallback((topicId, roleId, index) => {
    const fact = data[topicId]?.[roleId]?.[index] || '';
    setEditModal({ isOpen: true, editData: { topicId, roleId, index, fact, isNew: false } });
  }, [data]);

  const handleDelete = useCallback((topicId, roleId, index) => {
    if (!confirm('確定刪除此事實？')) return;
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      next[topicId][roleId].splice(index, 1);
      if (next[topicId][roleId].length === 0 && roleId !== 'all_roles') {
        delete next[topicId][roleId];
      }
      return next;
    });
    // Rebuild review keys for this topic+role
    setReviewState(prev => {
      const next = { ...prev };
      // Remove the deleted key
      delete next[makeKey(topicId, roleId, index)];
      // Re-index subsequent facts
      const oldFacts = data[topicId]?.[roleId] || [];
      for (let i = index + 1; i < oldFacts.length; i++) {
        const oldKey = makeKey(topicId, roleId, i);
        const newKey = makeKey(topicId, roleId, i - 1);
        next[newKey] = prev[oldKey] || 'approved';
        delete next[oldKey];
      }
      return next;
    });
  }, [data]);

  const handleAdd = useCallback(() => {
    setEditModal({
      isOpen: true,
      editData: { topicId: activeTopic, roleId: 'all_roles', index: -1, fact: '', isNew: true }
    });
  }, [activeTopic]);

  const handleChangeRole = useCallback((topicId, roleId, index) => {
    const fact = data[topicId]?.[roleId]?.[index] || '';
    setEditModal({
      isOpen: true,
      editData: { topicId, roleId, index, fact, isNew: false, isRoleChange: true, origRoleId: roleId }
    });
  }, [data]);

  const handleSave = useCallback((editData) => {
    const { topicId, roleId, index, fact, isNew, isRoleChange, origRoleId } = editData;

    if (isRoleChange && origRoleId && origRoleId !== roleId) {
      // Move fact to a different role
      setData(prev => {
        const next = JSON.parse(JSON.stringify(prev));
        // Remove from old role
        next[topicId][origRoleId].splice(index, 1);
        if (next[topicId][origRoleId].length === 0 && origRoleId !== 'all_roles') {
          delete next[topicId][origRoleId];
        }
        // Add to new role
        if (!next[topicId][roleId]) next[topicId][roleId] = [];
        next[topicId][roleId].push(fact);
        next._meta.updated = new Date().toISOString().split('T')[0];
        return next;
      });
      // Update review state
      setReviewState(prev => {
        const next = { ...prev };
        const oldStatus = prev[makeKey(topicId, origRoleId, index)] || 'draft';
        // Remove old key and re-index
        delete next[makeKey(topicId, origRoleId, index)];
        const oldFacts = data[topicId]?.[origRoleId] || [];
        for (let i = index + 1; i < oldFacts.length; i++) {
          next[makeKey(topicId, origRoleId, i - 1)] = prev[makeKey(topicId, origRoleId, i)] || 'approved';
          delete next[makeKey(topicId, origRoleId, i)];
        }
        // Add to new role at end
        const newRoleFacts = data[topicId]?.[roleId] || [];
        next[makeKey(topicId, roleId, newRoleFacts.length)] = oldStatus;
        return next;
      });
    } else if (isNew) {
      setData(prev => {
        const next = JSON.parse(JSON.stringify(prev));
        if (!next[topicId][roleId]) next[topicId][roleId] = [];
        next[topicId][roleId].push(fact);
        next._meta.updated = new Date().toISOString().split('T')[0];
        return next;
      });
      // New facts are drafts
      setReviewState(prev => {
        const newIdx = (data[topicId]?.[roleId] || []).length;
        return { ...prev, [makeKey(topicId, roleId, newIdx)]: 'draft' };
      });
    } else {
      setData(prev => {
        const next = JSON.parse(JSON.stringify(prev));
        next[topicId][roleId][index] = fact;
        next._meta.updated = new Date().toISOString().split('T')[0];
        return next;
      });
    }
  }, [data]);

  // Review handlers
  const handleApprove = useCallback((topicId, roleId, index) => {
    setReviewState(prev => ({ ...prev, [makeKey(topicId, roleId, index)]: 'approved' }));
  }, []);

  const handleReject = useCallback((topicId, roleId, index) => {
    setReviewState(prev => ({ ...prev, [makeKey(topicId, roleId, index)]: 'draft' }));
  }, []);

  // Batch approve all visible drafts
  const handleBatchApprove = useCallback(() => {
    const drafts = filteredFacts.filter(f => f.status === 'draft');
    if (drafts.length === 0) return;
    if (!confirm(`確認批量通過 ${drafts.length} 條待審核事實？`)) return;
    setReviewState(prev => {
      const next = { ...prev };
      drafts.forEach(f => { next[makeKey(activeTopic, f.roleId, f.index)] = 'approved'; });
      return next;
    });
  }, [filteredFacts, activeTopic]);

  // Validation
  const validation = useMemo(() => {
    const errors = [];
    const VALID_TOPICS = new Set(['finance','hr','curriculum','activity','student','it','general']);
    const VALID_ROLES = new Set(['all_roles','principal','vice_principal','panel_chair','subject_head','teacher','eo_admin','supplier']);
    Object.entries(data).forEach(([tid, td]) => {
      if (tid === '_meta') return;
      if (!VALID_TOPICS.has(tid)) errors.push(`Unknown topic: ${tid}`);
      Object.entries(td).forEach(([rk, fs]) => {
        if (rk.startsWith('_')) return;
        if (!VALID_ROLES.has(rk)) errors.push(`${tid}.${rk}: unknown role`);
        if (!Array.isArray(fs)) return;
        if (fs.length > 5) errors.push(`${tid}.${rk}: ${fs.length} facts > 5`);
        fs.forEach((f, i) => {
          if (f.length > 80) errors.push(`${tid}.${rk}[${i}]: ${f.length} chars > 80`);
        });
      });
    });
    return errors;
  }, [data]);

  return (
    <div className="min-h-screen">
      {/* ── K1 Header ── */}
      <header className="k1-header" id="k1Header">
        <div className="k1-header-inner">
          {/* Logo */}
          <div className="k1-logo" onClick={() => { setViewMode('qa'); window.scrollTo(0,0); }}>
            <span className="k1-logo-dot"></span>
            <div>
              <div className="k1-logo-text">K1知識平台</div>
              <div className="k1-logo-sub">香港學校管治 · {displayVersion}</div>
            </div>
          </div>

          {/* Actions */}
          <div className="k1-header-actions">
            {/* View mode tabs */}
            <div className="k1-tab-bar">
              <button onClick={() => setViewMode('about')}
                      className={`filter-tab ${viewMode === 'about' ? 'active-tab' : ''}`} aria-selected={viewMode === 'about'} role="tab">
                ℹ️ 平台介紹
              </button>
              <button onClick={() => setViewMode('qa')}
                      className={`filter-tab ${viewMode === 'qa' ? 'active-tab' : ''}`} aria-selected={viewMode === 'qa'} role="tab">
                🔍 政策搜尋
              </button>
              <button onClick={() => setViewMode('guidelines')}
                      className={`filter-tab ${viewMode === 'guidelines' ? 'active-tab' : ''}`} aria-selected={viewMode === 'guidelines'} role="tab">
                📚 指引 ({GUIDELINES_REGISTRY.length})
              </button>
              {adminMode && (
                <button onClick={() => setViewMode('review')}
                        className={`filter-tab ${viewMode === 'review' ? 'active-tab' : ''}`} aria-selected={viewMode === 'review'} role="tab"
                        style={{position:'relative'}}>
                  ✍️ 知識提煉
                  {candidateQueue.length > 0 && (
                    <span style={{
                      position:'absolute', top:'-6px', right: pendingSignalCount > 0 ? '16px' : '-4px',
                      background:'var(--warn)', color:'var(--paper)',
                      fontSize:'0.6rem', padding:'1px 5px', borderRadius:'100px',
                      fontWeight:700
                    }}>{candidateQueue.length}</span>
                  )}
                  {pendingSignalCount > 0 && (
                    <span title={`${pendingSignalCount} 個政策訊號待處理`} style={{
                      position:'absolute', top:'-6px', right:'-4px',
                      background:'var(--accent)', color:'#0A0C10',
                      fontSize:'0.6rem', padding:'1px 5px', borderRadius:'100px',
                      fontWeight:700
                    }}>📡{pendingSignalCount}</span>
                  )}
                </button>
              )}
              {adminMode && (
                <button onClick={() => setViewMode('knowledge')}
                        className={`filter-tab ${viewMode === 'knowledge' ? 'active-tab' : ''}`} aria-selected={viewMode === 'knowledge'} role="tab">
                  ⚙️ 知識管理
                </button>
              )}
            </div>

            {/* Status badges */}
            {viewMode === 'knowledge' && stats.draftCount > 0 && (
              <span className="k1-badge k1-badge-warning">{stats.draftCount} 待審</span>
            )}
            {viewMode === 'knowledge' && (
              <span className={`k1-badge ${validation.length === 0 ? 'k1-badge-ok' : 'k1-badge-error'}`}>
                {validation.length === 0 ? '✓ 驗證通過' : `⚠ ${validation.length} 問題`}
              </span>
            )}

            {/* Circular metric */}
            <span className="k1-badge k1-badge-warning" title="已接通 EDB Circular 通告分析流程，按已確認政策事實提供輔助。">
              ⚡ {stats.approvedCount * 18 + 432} 次調用
            </span>

            {/* Export */}
            {viewMode === 'knowledge' && adminMode && (
              <button onClick={() => setExportModal(true)} className="export-btn">匯出</button>
            )}

            {/* Admin toggle */}
            <button onClick={() => adminMode ? setAdminMode(false) : setShowAdminModal(true)}
                    title={adminMode ? '登出管理員' : '管理員登入'}
                    className={`k1-btn ${adminMode ? 'k1-btn-admin' : ''}`}>
              {adminMode ? '🔓 管理員' : '🔒 登入'}
            </button>

            {/* Reset */}
            <button onClick={handleReset} title="重設本地暫存至初始狀態"
                    className="k1-btn" style={{color:'var(--mid)'}}>
              🔄
            </button>

            {/* Circular analysis link */}
            <a href="k1-dashboard.html" className="k1-home-link" title="舊版管理介面（備份）" style={{opacity:0.4,fontSize:'0.7rem'}}>
              v1
            </a>
          </div>
        </div>
      </header>

      <div className="k1-layout">
       <div className="k1-layout-inner">
        {/* ── Sidebar (knowledge mode only) ── */}
        {viewMode === 'knowledge' && (
          <aside className="k1-sidebar">
            {/* Stats */}
            <div className="k1-card">
              <div className="k1-card-header">知識庫統計</div>
              <div className="k1-stat-grid">
                <div>
                  <div className="k1-stat-num">{stats.topicCount}</div>
                  <div className="k1-stat-label">範疇</div>
                </div>
                <div>
                  <div className="k1-stat-num">{stats.totalFacts}</div>
                  <div className="k1-stat-label">事實</div>
                </div>
                <div>
                  <div className="k1-stat-num">{stats.rolesUsed}</div>
                  <div className="k1-stat-label">角色</div>
                </div>
              </div>
            </div>

            {/* Review stats */}
            <div className="k1-card">
              <div className="k1-card-header">審核狀態</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',textAlign:'center',padding:'12px',gap:'4px'}}>
                <div>
                  <div className="k1-stat-num" style={{color:'var(--edb)',fontSize:'1.4rem'}}>{stats.approvedCount}</div>
                  <div className="k1-stat-label" style={{color:'var(--edb)'}}>已確認</div>
                </div>
                <div>
                  <div className="k1-stat-num" style={{color:'var(--mocha-dk)',fontSize:'1.4rem'}}>{stats.draftCount}</div>
                  <div className="k1-stat-label" style={{color:'var(--mocha-dk)'}}>待審核</div>
                </div>
              </div>
            </div>

            {/* Topic list */}
            <div className="k1-card">
              <div className="k1-card-header">知識範疇</div>
              {topics.map(t => (
                <button key={t.id}
                        onClick={() => { setActiveTopic(t.id); setFilterRole('all'); setSearchQuery(''); setFilterStatus('all'); }}
                        className={`topic-btn ${activeTopic === t.id ? 'active' : ''}`}>
                  <span style={{fontSize:'var(--text-sm)'}}>{t.label}</span>
                  <span style={{display:'flex',alignItems:'center',gap:'4px'}}>
                    {t.draftCount > 0 && <span className="k1-count-draft">{t.draftCount}</span>}
                    <span className="k1-count">{t.factCount}</span>
                  </span>
                </button>
              ))}
            </div>

            {/* Role filter */}
            <div className="k1-card">
              <div className="k1-card-header">角色篩選</div>
              <button onClick={() => setFilterRole('all')}
                      className={`topic-btn ${filterRole === 'all' ? 'active' : ''}`}>
                <span>全部角色</span>
              </button>
              {ROLE_ORDER.map(r => {
                const hasFacts = Array.isArray(currentTopic[r]) && currentTopic[r].length > 0;
                return (
                  <button key={r} onClick={() => setFilterRole(r)} disabled={!hasFacts}
                          className={`topic-btn ${filterRole === r ? 'active' : ''}`}
                          style={!hasFacts ? {opacity:0.35,cursor:'not-allowed'} : {}}>
                    <span>{ROLE_CONFIG[r].label}</span>
                    {hasFacts && <span className="k1-count">{currentTopic[r].length}</span>}
                  </button>
                );
              })}
            </div>
          </aside>
        )}

        {/* ── Main content ── */}
        <div className="k1-main">
          {viewMode === 'about' ? (
            <PlatformIntroPanel stats={stats} />
          ) : viewMode === 'guidelines' ? (
            <GuidelinesPanel setPreviewDoc={setPreviewDoc} />
          ) : viewMode === 'qa' ? (
            <QAPanel data={data} setPreviewDoc={setPreviewDoc} />
          ) : viewMode === 'review' ? (
            <CandidateReviewPanel queue={candidateQueue} onApprove={handleApproveCandidate} onReject={handleRejectCandidate} />
          ) : (
            <>
              {/* Topic header */}
              <div className="k1-topic-header">
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'12px',marginBottom:'12px',flexWrap:'wrap'}}>
                  <h2 className="k1-topic-title">{currentTopic._label || activeTopic}</h2>
                  <div style={{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}}>
                    {adminMode && (
                      <button onClick={() => setExportModal(true)} className="export-btn">匯出 / 備份</button>
                    )}
                    {adminMode && (
                      <button onClick={handleAdd} className="k1-btn k1-btn-admin">+ 新增事實</button>
                    )}
                  </div>
                </div>

                {currentTopic._keywords_zh && currentTopic._keywords_zh.length > 0 && (
                  <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'12px'}}>
                    {currentTopic._keywords_zh.map((kw, i) => (
                      <span key={i} className="k1-kw">{kw}</span>
                    ))}
                  </div>
                )}

                {/* Search + Status filter */}
                <div style={{display:'flex',alignItems:'center',gap:'10px',flexWrap:'wrap'}}>
                  <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                         placeholder="搜尋事實..." className="k1-input"
                         style={{flex:'1',minWidth:'160px'}} />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')}
                            style={{fontSize:'var(--text-sm)',color:'var(--mid)',cursor:'pointer',background:'none',border:'none',fontFamily:'inherit'}}>
                      清除
                    </button>
                  )}
                  <div className="k1-tab-bar">
                    {[['all','全部'],['draft','待審核'],['approved','已確認']].map(([key,label]) => (
                      <button key={key} onClick={() => setFilterStatus(key)}
                              className={`filter-tab ${filterStatus === key ? 'active-tab' : ''}`} aria-selected={filterStatus === key} role="tab">
                        {label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* Batch approve bar */}
              {currentDraftCount > 0 && filterStatus !== 'approved' && (
                <div className="batch-bar">
                  <span className="batch-bar-text">
                    顯示 <strong>{currentDraftCount}</strong> 條待審核事實
                  </span>
                  {adminMode && (
                    <button onClick={handleBatchApprove} className="k1-btn-approve-all">
                      全部確認通過
                    </button>
                  )}
                </div>
              )}

              {/* Facts list */}
              <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
                {filteredFacts.length === 0 ? (
                  <div className="k1-card" style={{padding:'40px',textAlign:'center',color:'var(--mid)',fontSize:'var(--text-sm)'}}>
                    此篩選條件下沒有事實條目
                  </div>
                ) : (
                  filteredFacts.map((item, i) => (
                    <FactCard key={`${item.roleId}-${item.index}-${i}`}
                              fact={item.fact} index={item.index} roleId={item.roleId}
                              topicId={activeTopic} status={item.status}
                              sourceRef={item.sourceRef}
                              onEdit={handleEdit} onDelete={handleDelete}
                              onApprove={handleApprove} onReject={handleReject}
                              onChangeRole={handleChangeRole}
                              isAdmin={adminMode} />
                  ))
                )}
              </div>

              {/* Sources */}
              <SourceList sources={currentTopic._sources} />
            </>
          )}
        </div>
       </div>
      </div>

      {/* ── Mobile bottom tab bar ── */}
      <nav className="mobile-tab-bar" role="navigation" aria-label="主要導航">
        <button className={`mobile-tab-item ${viewMode === 'qa' ? 'active' : ''}`}
                onClick={() => setViewMode('qa')} aria-label="政策搜尋">
          <span className="mobile-tab-icon">🔍</span>政策搜尋
        </button>
        <button className={`mobile-tab-item ${viewMode === 'guidelines' ? 'active' : ''}`}
                onClick={() => setViewMode('guidelines')} aria-label="指引文件庫">
          <span className="mobile-tab-icon">📚</span>指引
        </button>
        <button className={`mobile-tab-item ${viewMode === 'about' ? 'active' : ''}`}
                onClick={() => setViewMode('about')} aria-label="平台介紹">
          <span className="mobile-tab-icon">ℹ️</span>平台介紹
        </button>
        {adminMode && (
          <button className={`mobile-tab-item ${viewMode === 'review' ? 'active' : ''}`}
                  onClick={() => setViewMode('review')} aria-label="知識提煉">
            <span className="mobile-tab-icon">✍️</span>知識提煉
          </button>
        )}
        {adminMode && (
          <button className={`mobile-tab-item ${viewMode === 'knowledge' ? 'active' : ''}`}
                  onClick={() => setViewMode('knowledge')} aria-label="知識管理">
            <span className="mobile-tab-icon">⚙️</span>知識管理
          </button>
        )}
      </nav>

      {/* ── Footer ── */}
      <footer className="k1-footer">
        <div className="k1-footer-inner">
          <div style={{display:'flex',flexDirection:'column',gap:'4px'}}>
            <span style={{fontWeight:600,color:'rgba(240,238,233,0.75)'}}>K1知識平台 — 管理中心 {displayVersion}</span>
            <span>更新: {data._meta?.updated || data._meta?.created} &nbsp;·&nbsp; {stats.totalFacts} 事實 &nbsp;·&nbsp; {stats.topicCount} 範疇</span>
            <div style={{marginTop:'4px',display:'flex',gap:'16px'}}>
              <a href="index.html">← 返回首頁</a>
              <a href="https://www.edb.gov.hk" target="_blank" rel="noopener">EDB 教育局</a>
            </div>
          </div>
          <div style={{maxWidth:'560px',textAlign:'right'}}>
            <div style={{fontWeight:600,color:'rgba(240,238,233,0.65)',marginBottom:'4px'}}>
              維護：Wong Lai Ho Leonard
            </div>
            <div style={{fontSize:'0.72rem',opacity:0.6,lineHeight:1.5}}>
              免責聲明：本平台整理教育局公開指引與通告文件資料。所有資料僅供一般參考，不構成正式法律或行政意見。用戶應自行參閱教育局官方原文以作準。
            </div>
          </div>
        </div>
      </footer>

      {/* Modals */}
      <EditModal isOpen={editModal.isOpen} onClose={() => setEditModal({ isOpen: false, editData: null })}
                 onSave={handleSave} editData={editModal.editData} />
      <ExportModal isOpen={exportModal} onClose={() => setExportModal(false)} data={data} reviewState={reviewState} />
      <AdminPasswordModal isOpen={showAdminModal} onClose={() => setShowAdminModal(false)}
                          onSuccess={() => setAdminMode(true)} />

      {/* Slide-in Drawer Preview — only render backdrop when a doc is open */}
      {previewDoc && (
        <div
          className="fixed inset-0 pointer-events-auto"
          style={{ backgroundColor: 'rgba(61,43,34,0.45)', zIndex: 999 }}
          onClick={() => setPreviewDoc(null)}
        />
      )}

      <div
        className="fixed top-0 right-0 h-full flex flex-col"
        style={{
          width: '66%', background: 'var(--cd-warm)',
          boxShadow: 'var(--shadow-lg)',
          borderLeft: '1px solid var(--border)',
          transform: previewDoc ? 'translateX(0)' : 'translateX(100%)',
          transition: 'transform 0.3s cubic-bezier(0.4,0,0.2,1)',
          zIndex: 1000
        }}
      >
        <div className="k1-drawer-header flex items-center justify-between flex-shrink-0"
             style={{padding:'16px 24px'}}>
          <div className="flex flex-col min-w-0 pr-4">
            <span className="text-xs font-bold tracking-wider uppercase mb-1" style={{color:'var(--edb)'}}>推入預覽</span>
            <h3 className="font-medium text-gray-900 truncate text-sm">{previewDoc?.title || '載入中...'}</h3>
          </div>
          <div className="flex items-center gap-3 flex-shrink-0">
            {previewDoc && (
              <a href={previewDoc.url} target="_blank" rel="noopener"
                 className="px-4 py-2 text-xs rounded border border-gray-200 font-medium transition-colors shadow-sm"
                 style={{background:'var(--paper-2)', color:'var(--ink-2)'}}>
                另開新頁
              </a>
            )}
            <button onClick={() => setPreviewDoc(null)}
                    className="p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-full transition-colors"
                    style={{fontSize:'18px', lineHeight:'1'}}>✕</button>
          </div>
        </div>
        <div className="flex-1 relative w-full flex items-center justify-center" style={{background:'var(--paper-2)'}}>
          {previewDoc && (() => {
            const url = previewDoc.url;
            const isEdbHtml = url.includes('edb.gov.hk') && !url.toLowerCase().includes('.pdf');
            const isPdf = url.toLowerCase().includes('.pdf');
            if (isEdbHtml) {
              return (
                <div className="text-center px-8 py-12 max-w-md">
                  <div style={{fontSize:'48px', marginBottom:'16px'}}>🔒</div>
                  <h3 className="font-bold text-lg mb-2" style={{color:'var(--ink)'}}>EDB 網站不允許嵌入預覽</h3>
                  <p className="text-sm mb-6" style={{color:'var(--ink-2)'}}>
                    香港教育局網站設有安全限制，禁止在其他網頁內嵌入其內容。<br/>請點擊下方按鈕在新分頁開啟。
                  </p>
                  <a href={url} target="_blank" rel="noopener"
                     className="inline-flex items-center gap-2 px-6 py-3 rounded-lg font-medium text-white shadow-md transition-all hover:opacity-90"
                     style={{background:'var(--edb)'}}>
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                    </svg>
                    在新分頁開啟文件
                  </a>
                </div>
              );
            }
            const iframeSrc = isPdf
              ? `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`
              : url;
            return (
              <iframe
                src={iframeSrc}
                className="absolute inset-0 w-full h-full border-0"
                title="PDF 預覽"
              />
            );
          })()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
/* Header scroll shadow */
const hdr = document.getElementById('k1Header');
if (hdr) {
  window.addEventListener('scroll', () => {
    hdr.classList.toggle('scrolled', window.scrollY > 10);
  }, { passive: true });
}
</script>
</body>
</html>
