/* ═══════════════════════════════════════════════════════
   EDB 智能知識庫 — Facade Design System (Spec v0.1)
   Palette: Paper #F7F4ED + EDB Green #1F3A2E + Accent #8B6B2E
   Zero sparkle, zero purple gradient, zero streaming.
   Legacy var names (--cd, --mocha, --charcoal…) remapped
   to new palette so existing markup inherits automatically.
═══════════════════════════════════════════════════════ */

/* ── Design Tokens (EDB facade) ────────────────────── */
:root {
  /* Canonical EDB tokens */
  --ink:       #1B1F1A;
  --ink-2:     #3A4238;
  --ink-3:     #6B7268;
  --paper:     #F7F4ED;
  --paper-2:   #FBF9F3;
  --line:      #D8D2C4;
  --line-2:    #E8E3D6;
  --edb:       #1F3A2E;
  --edb-2:     #2E5A46;
  --edb-wash:  #E9EFE9;
  --accent:    #8B6B2E;   /* 校簿磚黃 */
  --stale:     #8A7A3B;
  --warn:      #7A3B1F;   /* 磚紅, 非 alarm red */

  /* Legacy Cloud Dancer aliases → remapped to paper palette */
  --cd:        var(--paper);
  --cd-warm:   var(--paper-2);
  --cd-cream:  var(--line-2);
  --cd-stone:  var(--line);

  /* Legacy Mocha aliases → remapped to EDB green + accent */
  --mocha:     var(--edb);
  --mocha-dk:  #0F2A1E;      /* deeper green for active/pressed */
  --mocha-lt:  var(--accent);
  --bark:      var(--edb);

  /* Neutrals alias */
  --charcoal:  var(--ink);
  --mid:       var(--ink-3);
  --sea:       var(--edb-wash);
  --border:    var(--line);
  --border-lt: var(--line-2);

  /* Legacy --p-* aliases (Tailwind overrides) */
  --p-primary:   var(--edb);
  --p-secondary: var(--accent);
  --p-accent:    var(--edb-2);
  --p-bg:        var(--paper);
  --p-surface:   var(--paper-2);
  --p-highlight: var(--line-2);
  --p-text:      var(--ink);
  --p-muted:     var(--ink-3);

  /* Fluid type — improved hierarchy */
  --text-hero: clamp(2rem, 4.5vw, 3rem);
  --text-xl:   clamp(1.15rem, 2.3vw, 1.4rem);
  --text-lg:   clamp(1.05rem, 2vw, 1.15rem);
  --text-base: clamp(0.9rem, 1.5vw, 0.9375rem);  /* 15px base */
  --text-sm:   clamp(0.8rem, 1.2vw, 0.855rem);   /* 13.7px */
  --text-xs:   0.72rem;                           /* 11.5px for meta/labels */

  /* Spacing */
  --space-xs:  clamp(0.3rem, 0.8vw, 0.5rem);
  --space-sm:  clamp(0.6rem, 1.5vw, 0.875rem);
  --space-md:  clamp(1rem, 2.5vw, 1.5rem);
  --space-lg:  clamp(1.5rem, 4vw, 2.5rem);

  /* Radius — 紙本感, 非 pill (Spec §2.4) */
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;

  /* Shadows — hairline paper, 非 SaaS drop shadow */
  --shadow-sm: 0 1px 0 var(--line-2);
  --shadow-md: 0 2px 0 var(--line);
  --shadow-lg: 0 2px 0 var(--line), 0 0 0 1px var(--line);

  /* Topic colour system — 4 policy domains */
  --t-finance:      #7A4500;  --t-finance-bg:   #FFF3E0;  --t-finance-bd:   rgba(122,69,0,0.18);
  --t-hr:           #2E7D32;  --t-hr-bg:        #E8F5E9;  --t-hr-bd:        rgba(46,125,50,0.18);
  --t-curriculum:   #2956A5;  --t-curriculum-bg:#E8F0FE;  --t-curriculum-bd:rgba(41,86,165,0.18);
  --t-admin:        #6B3FA0;  --t-admin-bg:     #F3E8FF;  --t-admin-bd:     rgba(107,63,160,0.18);

  /* Typography stack */
  --font-sans: "Noto Sans HK","IBM Plex Sans","PingFang HK","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
  --font-mono: "IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
}

/* ── Reset & Base ──────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; }
body {
  font-family: var(--font-sans);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.7;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── Tailwind colour overrides ─────────────────────── */
.bg-white        { background: var(--cd-warm) !important; }
.bg-gray-50      { background: var(--cd) !important; }
.bg-gray-100     { background: var(--cd-cream) !important; }
.border-gray-200 { border-color: var(--border) !important; }
.border-gray-100 { border-color: var(--border-lt) !important; }
.text-gray-800   { color: var(--charcoal) !important; }
.text-gray-700   { color: var(--charcoal) !important; }
.text-gray-600   { color: var(--mid) !important; }
.text-gray-500   { color: var(--mid) !important; }
.text-gray-400   { color: var(--cd-stone) !important; }
.text-gray-300   { color: var(--border) !important; }
.shadow-sm       { box-shadow: var(--shadow-sm) !important; }
.shadow-2xl      { box-shadow: var(--shadow-lg) !important; }

/* ── K1 Dashboard Header / Nav — EDB深綠實色 ──────── */
.k1-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--edb);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  transition: box-shadow 0.3s;
}
.k1-header.scrolled { box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
.k1-header-inner {
  max-width: 1400px; margin: 0 auto;
  padding: 0 var(--space-md);
  height: 56px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.k1-logo {
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; text-decoration: none;
  flex-shrink: 0;
}
.k1-logo-dot {
  width: 28px; height: 28px; border-radius: 6px;
  background: rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  color: #fff; letter-spacing: 0.04em; flex-shrink: 0;
}
.k1-logo-text {
  font-size: 0.95rem; font-weight: 700;
  color: #fff; letter-spacing: -0.02em;
  line-height: 1.1;
}
.k1-logo-sub {
  font-size: 0.65rem; color: rgba(255,255,255,0.5);
  letter-spacing: 0.06em; margin-top: 2px; text-transform: uppercase;
}
.k1-home-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--text-sm); color: rgba(255,255,255,0.65);
  text-decoration: none; padding: 5px 10px;
  border: 1px solid rgba(255,255,255,0.2); border-radius: var(--r-sm);
  transition: all 0.2s; white-space: nowrap;
  flex-shrink: 0;
}
.k1-home-link:hover { color: #fff; border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.08); }
.k1-header-actions {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
}

/* ── View Mode Tabs — on dark header ──────────────── */
.k1-tab-bar {
  display: flex; border-radius: var(--r-sm);
  border: 1px solid rgba(255,255,255,0.2);
  overflow: hidden; background: rgba(255,255,255,0.08);
}
.filter-tab {
  transition: all 0.15s; cursor: pointer;
  padding: 6px 14px; font-size: var(--text-sm); font-weight: 500;
  border: none; background: none; color: rgba(255,255,255,0.65);
  border-right: 1px solid rgba(255,255,255,0.15); white-space: nowrap;
  font-family: inherit;
}
.filter-tab:last-child { border-right: none; }
.filter-tab.active-tab {
  background: rgba(255,255,255,0.18); color: #fff; font-weight: 600;
}
.filter-tab:not(.active-tab):hover { background: rgba(255,255,255,0.1); color: #fff; }
/* S169 ② — header help/onboarding button (sits beside tab bar on dark header) */
.k1-help-btn {
  transition: all 0.15s; cursor: pointer; padding: 6px 12px;
  font-size: var(--text-sm); font-weight: 600; font-family: inherit; white-space: nowrap;
  border-radius: var(--r-sm); border: 1px solid rgba(255,255,255,0.28);
  background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.82);
}
.k1-help-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
/* Light-background variant — filter-tab is white-on-dark for the header bar; on
   light content areas (政策範本 校類 filter, 文件標註 範疇 chips) use dark text. */
.filter-tab-light { color: var(--ink, #3d2b22); border: 1px solid var(--line, #d9d2c6); border-radius: 8px; background: #fff; }
.filter-tab-light.active-tab { background: var(--edb, #1f4e36); color: #fff; border-color: var(--edb, #1f4e36); }
.filter-tab-light:not(.active-tab):hover { background: var(--paper-2, #f4efe6); color: var(--edb, #1f4e36); }

/* ── Auth / Action Buttons — on dark header ─────── */
.k1-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: var(--r-sm);
  font-size: var(--text-sm); font-weight: 500;
  border: 1px solid rgba(255,255,255,0.2); cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
  font-family: inherit; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75);
}
.k1-btn:hover { border-color: rgba(255,255,255,0.45); color: #fff; background: rgba(255,255,255,0.14); }
.k1-btn-admin {
  background: rgba(255,255,255,0.12); color: #fff;
  border-color: rgba(255,255,255,0.25);
}
.k1-btn-admin:hover { background: rgba(255,255,255,0.2); }
.k1-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 100px;
  font-size: var(--text-sm); white-space: nowrap;
}
.k1-badge-warning { background: rgba(255,200,80,0.18); color: #FFDE8A; border: 1px solid rgba(255,200,80,0.3); }
.k1-badge-ok { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.2); }
.k1-badge-error { background: rgba(220,80,60,0.2); color: #FFAAA0; border: 1px solid rgba(220,80,60,0.3); }

/* ── Export Button ─────────────────────────────────── */
.export-btn {
  background: rgba(255,255,255,0.92); color: var(--edb);
  border: 1px solid rgba(255,255,255,0.4); transition: all 0.15s;
  padding: 6px 14px; border-radius: var(--r-sm);
  font-size: var(--text-sm); font-weight: 700; cursor: pointer;
  font-family: inherit;
}
.export-btn:hover { background: #fff; border-color: #fff; }

/* ── Main Layout ───────────────────────────────────── */
.k1-layout { max-width: 1400px; margin: 0 auto; padding: var(--space-md); }
.k1-layout-inner { display: flex; gap: var(--space-md); align-items: flex-start; }

/* ── Sidebar ───────────────────────────────────────── */
.k1-sidebar {
  width: 240px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: var(--space-sm);
}
.k1-card {
  background: var(--cd-warm);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
}
.k1-card-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-lt);
  font-size: 0.68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--ink-3); font-family: var(--font-mono);
}
/* Stats card */
.k1-stat-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  text-align: center; padding: 12px;
  gap: 4px;
}
.k1-stat-num {
  font-size: 1.6rem; font-weight: 800;
  letter-spacing: -0.03em; color: var(--charcoal);
  line-height: 1;
}
.k1-stat-label { font-size: 0.68rem; color: var(--mid); margin-top: 2px; }
/* Topic/role list */
.topic-btn {
  transition: all 0.15s; display: flex;
  align-items: center; justify-content: space-between;
  width: 100%; text-align: left;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-lt);
  background: none; border-left: none; border-right: none; border-top: none;
  font-family: inherit; font-size: var(--text-sm); color: var(--mid);
  cursor: pointer;
}
.topic-btn:last-child { border-bottom: none; }
.topic-btn:hover { background: var(--cd-cream); color: var(--charcoal); }
.topic-btn.active {
  background: var(--charcoal) !important;
  color: var(--cd) !important;
  border-color: var(--charcoal) !important;
}
.topic-btn.active .k1-count { background: rgba(240,238,233,0.2); color: var(--cd); }
.k1-count {
  font-size: 0.68rem; padding: 2px 8px;
  border-radius: 100px; background: var(--cd-cream);
  color: var(--mid); font-weight: 600; flex-shrink: 0;
}
.k1-count-draft {
  font-size: 0.68rem; padding: 2px 7px;
  border-radius: 100px;
  background: rgba(164,119,100,0.12);
  color: var(--mocha-dk); font-weight: 700; margin-right: 4px;
}

/* ── Main Content ──────────────────────────────────── */
.k1-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-sm); }

/* Topic header card */
.k1-topic-header {
  background: var(--cd-warm); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: var(--space-md);
}
.k1-topic-title {
  font-size: var(--text-xl); font-weight: 800;
  letter-spacing: -0.02em; color: var(--charcoal);
}

/* Search input */
.k1-input {
  border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 8px 12px; font-size: var(--text-sm); font-family: inherit;
  background: var(--cd); color: var(--charcoal);
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}
.k1-input:focus { border-color: var(--mocha); box-shadow: 0 0 0 3px rgba(164,119,100,0.1); }

/* Keyword chips */
.k1-kw {
  font-size: 0.72rem; background: var(--cd-cream);
  color: var(--mid); padding: 2px 8px; border-radius: 4px;
}

/* Batch bar */
.batch-bar {
  background: rgba(164,119,100,0.06);
  border: 1px solid rgba(164,119,100,0.18);
  border-radius: var(--r-md); padding: 12px var(--space-md);
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.batch-bar-text { font-size: var(--text-sm); color: var(--mocha-dk); }
.k1-btn-approve-all {
  background: var(--charcoal); color: var(--cd);
  border: none; border-radius: var(--r-sm);
  padding: 7px 16px; font-size: var(--text-sm); font-weight: 600;
  cursor: pointer; transition: background 0.15s; font-family: inherit;
}
.k1-btn-approve-all:hover { background: var(--edb); }

/* ── Fact Cards ─────────────────────────────────────── */
.fact-card {
  transition: all 0.2s; background: var(--cd-warm);
  border: 1px solid var(--border); border-radius: var(--r-md);
  padding: var(--space-sm) var(--space-md);
}
.fact-card:hover { box-shadow: var(--shadow-md); }
.fact-card.draft { border-left: 3px solid var(--mocha-lt); }
.fact-card.approved { border-left: 3px solid var(--edb-2); }

/* ── Candidate review split workspace ───────────────── */
.review-workspace {
  display: grid; grid-template-columns: minmax(0, 1fr) 380px;
  gap: var(--space-md); align-items: start;
}
.review-list, .review-inspector, .review-empty {
  background: var(--cd-warm); border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.review-list { overflow: hidden; }
.review-head {
  padding: var(--space-md); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.review-head h2 { margin: 0; font-size: 1rem; color: var(--charcoal); }
.review-head p { margin: 3px 0 0; font-size: var(--text-sm); color: var(--mid); }
.review-metric {
  font-family: var(--mono); font-size: 0.72rem; color: var(--edb);
  background: var(--edb-wash); border: 1px solid rgba(31,58,46,0.12);
  padding: 5px 8px; border-radius: var(--r-sm); white-space: nowrap;
}
.candidate-row {
  width: 100%; border: 0; border-bottom: 1px solid var(--border);
  background: transparent; text-align: left; padding: 14px var(--space-md);
  cursor: pointer; font-family: inherit; display: grid; gap: 7px;
  transition: background 0.16s, border-color 0.16s;
}
.candidate-row:hover, .candidate-row.active { background: var(--paper-2); }
.candidate-row.active { box-shadow: inset 3px 0 0 var(--edb); }
.candidate-row:last-child { border-bottom: 0; }
.candidate-row-top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.candidate-topic {
  font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.06em;
  color: var(--edb); text-transform: uppercase;
}
.candidate-source {
  font-size: 0.72rem; color: var(--mid); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; max-width: 180px;
}
.candidate-text { font-size: var(--text-sm); color: var(--charcoal); line-height: 1.55; }
.candidate-roles { display: flex; flex-wrap: wrap; gap: 5px; }
.candidate-role-pill {
  font-size: 0.68rem; color: var(--mid); border: 1px solid var(--border);
  background: #fff; padding: 2px 6px; border-radius: var(--r-sm);
}
.review-inspector {
  position: sticky; top: 88px; padding: var(--space-md);
  display: grid; gap: 14px;
}
.inspector-label {
  font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--edb);
}
.inspector-title { font-size: 1.05rem; font-weight: 700; color: var(--charcoal); }
.inspector-box {
  border: 1px solid var(--border); background: var(--paper-2);
  border-radius: var(--r-sm); padding: 11px; color: var(--ink-2);
  font-size: var(--text-sm); line-height: 1.6;
}
.review-editor {
  width: 100%; min-height: 112px; resize: vertical; font-family: inherit;
  font-size: var(--text-sm); line-height: 1.6; color: var(--charcoal);

/* ── Mobile responsive ──────────────────────────────── */

// ── Guidelines Panel ──
function GuidelinesPanel({ setPreviewDoc }) {
  const [activeCat, setActiveCat] = useState('all');
  const [activeLevel, setActiveLevel] = useState('all');
  const [searchQ, setSearchQ] = useState('');
  const [sortBy, setSortBy] = useState('year-desc'); // 'year-desc' | 'year-asc' | 'title'

  const CATS = [
    { key: 'all',   label: '全部',   icon: '📋' },
    { key: '課程',   label: '課程',   icon: '📚' },
    { key: '財務採購', label: '財務採購', icon: '💰' },
    { key: '人力資源', label: '人力資源', icon: '👥' },
    { key: '學生事務', label: '學生事務', icon: '🎒' },
    { key: '學生安全', label: '學生安全', icon: '🛡️' },
    { key: '安全',   label: '科目安全', icon: '⚠️' },
    { key: '活動',   label: '活動',   icon: '🏃' },
    { key: '津貼',   label: '津貼',   icon: '🏷️' },
    { key: '行政',   label: '行政',   icon: '🏫' },
    { key: '資訊科技', label: '資訊科技', icon: '💻' },
  ];

  const catCounts = useMemo(() => {
    const counts = { all: GUIDELINES_REGISTRY.length };
    GUIDELINES_REGISTRY.forEach(g => { counts[g.category] = (counts[g.category] || 0) + 1; });
    return counts;
  }, []);

  const LEVELS = ['幼稚園', '小學', '中學', '特殊', '跨階段'];

  // Sub-category display labels
  const SUB_CAT_LABELS = {
    procurement: '採購程序', lsg: '法團校董會',
    leave: '請假安排', conduct: '專業操守',
    general: '整體課程指引', language: '語文教育',
    math_science: '數理科學及科技', humanities: '人文社會科學',
    values: '價值觀及公民教育', arts_pe: '藝術及體育',
    ph_primary: '小學人文科', pri_science: '小學科學科',
    sen_gifted: '特殊及資優教育', safety: '科目安全指引',
    admin: '行政安排', grant: '津貼及資源', activity: '學校活動',
    discipline: '訓育及輔導', sen: '融合教育',
    security: '資訊保安', kindergarten: '幼稚園', stat: '統計數字',
  };

  // Preferred sub-category order per main category
  const SUB_CAT_SEQ = {
    '財務採購': ['lsg','procurement'],
    '人力資源': ['leave','conduct','stat'],
    '課程':     ['general','language','math_science','pri_science','ph_primary','humanities','values','arts_pe','sen_gifted','safety','admin','stat'],
    '活動':     ['grant','activity'],
    '學生事務': ['discipline','sen','safety','stat'],
    '資訊科技': ['security'],
    '行政':     ['admin','kindergarten'],
  };

  const filtered = useMemo(() => {
    let list = GUIDELINES_REGISTRY.filter(g => {
      if (activeCat !== 'all' && g.category !== activeCat) return false;
      // Level filter applies to ALL categories (every entry has a level field)
      if (activeLevel !== 'all' && g.level !== activeLevel) return false;
      if (searchQ && !g.title.includes(searchQ) && !g.titleShort.includes(searchQ)) return false;
      return true;
    });
    if (sortBy === 'year-desc') list = [...list].sort((a, b) => parseInt(b.year) - parseInt(a.year));
    else if (sortBy === 'year-asc') list = [...list].sort((a, b) => parseInt(a.year) - parseInt(b.year));
    else if (sortBy === 'title') list = [...list].sort((a, b) => a.title.localeCompare(b.title, 'zh-HK'));
    return list;
  }, [activeCat, activeLevel, searchQ, sortBy]);

  // Grouped view: when a specific category is active and no search query
  const groupedView = useMemo(() => {
    if (activeCat === 'all' || searchQ) return null;
    const bySubCat = {};
    filtered.forEach(g => {
      const key = g.sub_category || 'other';
      if (!bySubCat[key]) bySubCat[key] = [];
      bySubCat[key].push(g);
    });
    // Sort each group year desc
    Object.values(bySubCat).forEach(arr => arr.sort((a, b) => parseInt(b.year) - parseInt(a.year)));
    const seq = SUB_CAT_SEQ[activeCat] || [];
    const groups = [];
    seq.forEach(sc => { if (bySubCat[sc]) groups.push({ key: sc, label: SUB_CAT_LABELS[sc] || sc, items: bySubCat[sc] }); });
    Object.keys(bySubCat).forEach(sc => { if (!seq.includes(sc)) groups.push({ key: sc, label: SUB_CAT_LABELS[sc] || sc, items: bySubCat[sc] }); });
    return groups;
  }, [activeCat, filtered, searchQ]);

  const activeCatLabel = CATS.find(c => c.key === activeCat)?.label || '全部';

  const formatBadge = (fmt) => {
    if (fmt === 'PDF') return { bg: 'bg-orange-100', text: 'text-amber-900', border: 'border-orange-200' };
    if (fmt === 'HTML') return { bg: 'bg-stone-100', text: 'text-stone-700', border: 'border-stone-200' };
    return { bg: 'bg-gray-50', text: 'text-gray-600', border: 'border-gray-200' };
  };

  // Use light backgrounds + dark text so year is always legible regardless of card border color
  const yearColor = (yr) => {
    const y = parseInt(yr);
    if (!yr || isNaN(y)) return 'bg-gray-100 text-gray-500';
    if (y >= 2024) return 'bg-orange-100 text-amber-900 font-extrabold';
    if (y >= 2020) return 'bg-gray-100 text-gray-600 font-bold';
    if (y >= 2015) return 'bg-amber-100 text-amber-800';
    return 'bg-gray-100 text-gray-500';
  };

  const levelColors = {
    '幼稚園': 'bg-orange-50 text-amber-900 border border-orange-200',
    '小學':   'bg-stone-50 text-stone-700 border border-stone-200',
    '中學':   'bg-amber-50 text-amber-900 border border-amber-200',
    '特殊':   'bg-stone-100 text-stone-800 border border-stone-300',
    '跨階段': 'bg-gray-50 text-gray-600 border border-gray-200',
  };

  return (
    <div className="flex-1 min-w-0 flex gap-4">
      {/* ── Left sidebar: category nav ── */}
      <div className="w-44 flex-shrink-0">
        <div className="bg-white rounded-xl border border-gray-200 overflow-hidden sticky top-4">
          <div className="px-4 py-3 border-b border-gray-100">
            <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide">分類</p>
          </div>
          <nav className="py-1">
            {CATS.filter(c => c.key === 'all' || catCounts[c.key]).map(cat => {
              const isActive = activeCat === cat.key;
              return (
                <button key={cat.key} onClick={() => { setActiveCat(cat.key); }}
                  style={isActive ? {
                    background: 'var(--edb)',
                    color: '#ffffff',
                    fontWeight: 600,
                    boxShadow: '0 2px 8px rgba(13, 107, 71, 0.25)',
                  } : {}}
                  className={`w-full flex items-center justify-between px-4 py-2.5 text-sm transition-all
                    ${isActive ? '' : 'text-gray-700 hover:bg-gray-50'}`}>
                  <span className="flex items-center gap-2">
                    <span className="text-base leading-none">{cat.icon}</span>
                    <span>{cat.label}</span>
                  </span>
                  <span style={isActive ? {
                    background: 'rgba(255,255,255,0.22)',
                    color: '#ffffff',
                  } : {}}
                  className={`text-xs font-medium px-1.5 py-0.5 rounded-full min-w-5 text-center
                    ${isActive ? '' : 'bg-gray-100 text-gray-500'}`}>
                    {catCounts[cat.key] || 0}
                  </span>
                </button>
              );
            })}
          </nav>
        </div>
      </div>

      {/* ── Right: header + cards ── */}
      <div className="flex-1 min-w-0">
        {/* Toolbar */}
        <div className="bg-white rounded-xl border border-gray-200 p-4 mb-3">
          <div className="flex flex-wrap items-center gap-3 mb-3">
            <div className="flex-1 min-w-0">
              <h2 className="text-base font-bold text-gray-800">
                {activeCat === 'all' ? '全部指引文件' : activeCatLabel}
                <span className="ml-2 text-sm font-normal text-gray-400">({filtered.length} 份)</span>
              </h2>
            </div>
            <input type="text" value={searchQ} onChange={e => setSearchQ(e.target.value)}
                   placeholder="搜尋名稱..."
                   className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm w-44 focus:ring-2 focus:ring-amber-200 focus:border-transparent" />
            <div className="flex items-center gap-1 border border-gray-200 bg-gray-50 rounded-lg p-1 text-xs shadow-inner">
              {[
                { val: 'year-desc', label: '最新' },
                { val: 'year-asc',  label: '最舊' },
                { val: 'title',     label: '名稱' },
              ].map(s => (
                <button key={s.val} onClick={() => setSortBy(s.val)}
                  className={`px-3 py-1.5 font-medium rounded-md transition-all
                    ${sortBy === s.val 
                      ? 'bg-white text-amber-900 shadow-sm border border-gray-200 drop-shadow-sm' 
                      : 'text-gray-500 hover:text-gray-800 hover:bg-gray-200/50'}`}>
                  {s.label}
                </button>
              ))}
            </div>
          </div>
          {/* Level filter — shown for ALL categories (every guideline has a level field) */}
          <div className="flex flex-wrap gap-1.5 pt-2 border-t border-gray-100">
            <span className="text-xs text-gray-400 self-center mr-1">學習階段：</span>
            {['all', ...LEVELS].map(lv => {
              const isActive = activeLevel === lv;
              return (
                <button key={lv} onClick={() => setActiveLevel(lv)}
                  style={isActive ? {
                    background: 'var(--edb)',
                    color: '#ffffff',
                    borderColor: 'var(--edb)',
                  } : {}}
                  className={`px-2.5 py-1 text-xs rounded-full border font-medium transition-all
                    ${isActive ? '' : 'bg-white text-gray-600 border-gray-200 hover:border-amber-300 hover:text-amber-900'}`}>
                  {lv === 'all' ? '全部階段' : lv}
                </button>
              );
            })}
          </div>
        </div>

        {/* Cards — grouped by sub_category when a specific category is active */}
        {filtered.length === 0 ? (
          <div className="bg-white rounded-xl border border-gray-200 p-10 text-center text-gray-400">
            <p className="text-sm">找不到符合條件的指引文件</p>
          </div>
        ) : groupedView ? (
          /* ── Grouped view: category → sub_category → year desc ── */
          <div className="space-y-5">
            {groupedView.map(group => (
              <div key={group.key}>
                {/* Sub-category header */}
                <div className="flex items-center gap-2 mb-2 px-1">
                  <span className="text-xs font-bold text-amber-800 uppercase tracking-wider">{group.label}</span>
                  <span className="text-xs text-gray-400 font-medium">({group.items.length})</span>
                  <div className="flex-1 h-px bg-amber-100"></div>
                </div>
                {/* Items in this group */}
                <div className="space-y-2">
                  {group.items.map(g => {
                    const fmt = formatBadge(g.format);
                    return (
                      <div key={g.id} className="guideline-card bg-white rounded-lg border border-gray-200 px-4 py-3 flex items-center gap-4 animate-in">
                        <div className={`flex-shrink-0 w-14 text-center rounded-lg py-1.5 text-sm font-bold ${yearColor(g.year)}`}>{g.year}</div>
                        <div className="flex-1 min-w-0">
                          <p className="text-sm font-medium text-gray-800 leading-snug">{g.title}</p>
                          <div className="flex items-center gap-1.5 mt-1 flex-wrap">
                            {g.level && <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${levelColors[g.level] || 'bg-gray-50 text-gray-500 border border-gray-200'}`}>{g.level}</span>}
                            <span className={`text-xs px-2 py-0.5 rounded border font-medium ${fmt.bg} ${fmt.text} ${fmt.border}`}>{g.format}</span>
                          </div>
                        </div>
                        <div className="flex-shrink-0">
                          <a href={g.url} target="_blank" rel="noopener"
                             style={{ background: 'var(--edb)', color: '#ffffff' }}
                             className="flex items-center gap-1 px-4 py-2 text-xs rounded-lg font-medium transition-colors whitespace-nowrap hover:opacity-90 shadow-sm">
                            <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                            </svg>
                            另開新頁
                          </a>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        ) : (
          /* ── Flat view: "all" or search results ── */
          <div className="space-y-2">
            {filtered.map(g => {
              const fmt = formatBadge(g.format);
              return (
                <div key={g.id} className="guideline-card bg-white rounded-lg border border-gray-200 px-4 py-3 flex items-center gap-4 animate-in">
                  <div className={`flex-shrink-0 w-14 text-center rounded-lg py-1.5 text-sm font-bold ${yearColor(g.year)}`}>{g.year}</div>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-medium text-gray-800 leading-snug">{g.title}</p>
                    <div className="flex items-center gap-1.5 mt-1 flex-wrap">
                      <span className="text-xs px-2 py-0.5 rounded-full bg-orange-50 text-amber-800 border border-orange-100 font-medium">{g.category}</span>
                      {g.level && <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${levelColors[g.level] || 'bg-gray-50 text-gray-500 border border-gray-200'}`}>{g.level}</span>}
                      <span className={`text-xs px-2 py-0.5 rounded border font-medium ${fmt.bg} ${fmt.text} ${fmt.border}`}>{g.format}</span>
                    </div>
                  </div>
                  <div className="flex-shrink-0">
                    <a href={g.url} target="_blank" rel="noopener"
                       style={{ background: 'var(--edb)', color: '#ffffff' }}
                       className="flex items-center gap-1 px-4 py-2 text-xs rounded-lg font-medium transition-colors whitespace-nowrap hover:opacity-90 shadow-sm">
                      <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                      </svg>
                      另開新頁
                    </a>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// Public-facing platform release version. DECOUPLED from the frozen knowledge.json
// data-contract version (_meta.version stays 2.3.0 — the 455-fact Channel A dataset

// platform's growth from a search-only tool into a full compliance suite:
// 政策搜尋 + 文件標註（就地標註）+ 範本下載 + 合規清單修訂，跨 15 個合規範疇。
const PLATFORM_VERSION = '3.1.0';

function PlatformIntroPanel({ stats }) {
  const [demoTab, setDemoTab] = React.useState(0);
  const [demoVisible, setDemoVisible] = React.useState(false);
  const [counts, setCounts] = React.useState([0, 0, 0, 0]);

  // Animate stat counters on mount — pull from stats.metaStats (single source of truth from _meta.stats)
  const meta = stats.metaStats || {};
  // Single-source derived counts/version (literals kept only as || fallback if stats missing)
  const factsCount = meta.facts || 455;
  const chunksCount = meta.chunks || 15127;
  const guidelinesCount = GUIDELINES_REGISTRY.length;
  const sourcesCount = meta.sources || 120;
  const platformVersion = PLATFORM_VERSION;
  const statTargets = [
    stats.approvedCount || factsCount,
    chunksCount,
    guidelinesCount,
    sourcesCount,
  ];
  React.useEffect(() => {
    const duration = 900;
    const steps = 40;
    const interval = duration / steps;
    let step = 0;
    const timer = setInterval(() => {
      step++;
      const progress = step / steps;
      const ease = 1 - Math.pow(1 - progress, 3); // ease-out cubic
      setCounts(statTargets.map(t => Math.round(t * ease)));
      if (step >= steps) clearInterval(timer);
    }, interval);
    return () => clearInterval(timer);
  }, []);

  // Animate demo result on tab change
  React.useEffect(() => {
    setDemoVisible(false);
    const t = setTimeout(() => setDemoVisible(true), 120);
    return () => clearTimeout(t);
  }, [demoTab]);

  const demoQueries = [
    {
      role: '校長',

      source: '學校行政手冊（SAG）2025年11月版',
      sourceUrl: 'https://www.edb.gov.hk/attachment/tc/sch-admin/regulations/sch-admin-guide/sag_c.pdf',
      tags: ['人力資源', '假期'],
    },
    {
      role: '文書主任',
      query: '學校購買儀器需要邀請幾份報價？',
      answer: '根據《資助則例》第XII章，購買金額 $5,000 至 $50,000 的儀器，須邀請至少三份書面報價；$50,000 以上須採用公開招標或邀請投標程序，並由採購委員會審批。',

// ── Q&A Panel ──
function SourcesAccordion({ results, topicLabels }) {
  const [open, setOpen] = React.useState(false);

  // Group chunks by source document; chunks without URL → single "已核實政策事實" group
  const NO_URL_KEY = '__approved_facts__';
  const docMap = {};
  results.forEach(item => {
    const hasUrl = item.sourceRef && item.sourceRef.url;
    const key = hasUrl ? item.sourceRef.url : NO_URL_KEY;
    if (!docMap[key]) {
      docMap[key] = {
        title: hasUrl ? item.sourceRef.title : '已核實政策事實',
        url: hasUrl ? item.sourceRef.url : null,
        topic: item.topicId,
        chunks: [],
        bestScore: 0,
        isApprovedFacts: !hasUrl,
      };
    }
    docMap[key].chunks.push(item);
    if (item.score > docMap[key].bestScore) docMap[key].bestScore = item.score;
  });

  const docs = Object.values(docMap).sort((a, b) => b.bestScore - a.bestScore);
  const totalChunks = results.length;

  return (
    <div style={{border:'1px solid var(--line)',borderRadius:'var(--r-md)',overflow:'hidden'}}>
      <button onClick={() => setOpen(v => !v)}
        style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',
                padding:'10px 14px',background:'var(--paper-2)',border:'none',cursor:'pointer',
                fontSize:'var(--text-xs)',color:'var(--ink-3)'}}>
        <span>📎 參考來源 · {docs.length} 份文件，{totalChunks} 個片段</span>
        <span style={{transform:open?'rotate(180deg)':'none',transition:'transform .2s'}}>▾</span>
      </button>
      {open && (
        <div style={{background:'var(--paper-2)'}}>
          {docs.map((doc, di) => (
            <div key={di}
                 style={{display:'flex',alignItems:'flex-start',gap:'10px',
                         padding:'9px 14px',
                         borderTop: di === 0 ? 'none' : '1px solid #F0EDE9'}}>
              <span style={{fontSize:'14px',marginTop:'1px',flexShrink:0}}>
                {doc.isApprovedFacts ? '✅' : '📄'}
              </span>
              <div style={{flex:1,minWidth:0}}>
                {doc.url ? (
                  <a href={doc.url} target="_blank" rel="noopener"
                     style={{fontSize:'var(--text-xs)',fontWeight:600,color:'var(--ink)',
                             textDecoration:'none',display:'block',
                             overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {doc.title}
                  </a>
                ) : (
                  <span style={{fontSize:'var(--text-xs)',fontWeight:600,
                                color: doc.isApprovedFacts ? 'var(--edb)' : 'var(--ink)'}}>
                    {doc.title}
                  </span>
                )}
                <span style={{fontSize:'10px',color:'var(--ink-3)'}}>
                  {doc.chunks.length} 個片段
                  {(() => {
                    const pages = [...new Set(doc.chunks.map(c => c.page).filter(Boolean))].sort((a,b)=>a-b);
                    if (pages.length === 0) return '';
                    const isPdf = doc.url && doc.url.toLowerCase().includes('.pdf');
                    return (
                      <React.Fragment> · 頁 {pages.map((p, pi) => (
                        <React.Fragment key={p}>
                          {pi > 0 && ', '}
                          {isPdf ? (
                            <a href={`${doc.url}#page=${p}`} target="_blank" rel="noopener"
                               title={`在新分頁開啟文件第 ${p} 頁`}
                               style={{color:'var(--edb)',textDecoration:'underline',textUnderlineOffset:'2px'}}>{p}</a>
                          ) : p}
                        </React.Fragment>
                      ))}</React.Fragment>
                    );
                  })()}
                </span>
              </div>
              {doc.url && (
                <a href={doc.url} target="_blank" rel="noopener"
                   style={{fontSize:'10px',color:'var(--edb)',textDecoration:'none',
                           flexShrink:0,marginTop:'2px'}}>
                  ↗ 開啟
                </a>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function QAPanel({ data, setPreviewDoc }) {
  const [query, setQuery] = useState('');

  const [synthesis, setSynthesis] = useState(null);
  const [searched, setSearched] = useState(false);
  const [qaRole, setQaRole] = useState('all_roles');
  const [searchChannel, setSearchChannel] = useState('B'); // 'B' only (A / AB surfaces retired — dormant)
  const [isLoading, setIsLoading] = useState(false);
  const [backendError, setBackendError] = useState(null);

  const BACKEND_URL = 'https://edb-knowledge.onrender.com';
  const TOPIC_LABELS = {
    finance: '財務/採購', hr: '人力資源', curriculum: '課程',
    activity: '活動', student: '學生事務', it: '資訊科技', general: '通用/行政'
  };

  // Channel A: backend semantic search over approved facts (with synthesis)
  const runChannelA = useCallback(async (q, targetRole) => {
    const body = {
      query: q,
      min_score: 0.1,
      synthesize: true,
      ...(targetRole !== 'all_roles' ? { role: targetRole } : {}),
    };
    const resp = await fetch(`${BACKEND_URL}/api/search/channel-a`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if (!resp.ok) throw Object.assign(new Error(`HTTP ${resp.status}`), { status: resp.status });
    const json = await resp.json();
    setSynthesis(json.synthesis || null);
    return (json.results || []).map(r => ({
      topicId: r.topic || 'general',
      roleId: r.role || 'all_roles',
      fact: r.text, index: 0,
      sourceRef: null,
      score: r.score, channel: 'A',
    }));
  }, []);

  // Channel B: backend semantic search (requires backend running)
  const runChannelB = useCallback(async (q) => {
    const resp = await fetch(`${BACKEND_URL}/api/search/channel-b`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ query: q, min_score: 0.15, top_k: 8 })
    });
    if (!resp.ok) throw Object.assign(new Error(`HTTP ${resp.status}`), { status: resp.status });
    const json = await resp.json();
    setSynthesis(json.synthesis || null);
    return (json.results || []).map(r => ({
      topicId: r.topic || 'general', roleId: r.role || 'all_roles',
      fact: r.text, index: 0,
      sourceRef: r.url ? { url: r.url, title: r.title } : null,
      score: r.score, channel: 'B',
      content_type: r.content_type, fact_type: r.fact_type,
      page: r.page,
    }));
  }, []);

  // A+B: combined backend search
  const runCombined = useCallback(async (q) => {
    const resp = await fetch(`${BACKEND_URL}/api/search/combined`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ query: q, min_score: 0.15, top_k: 8 })

    if (!resp.ok) throw Object.assign(new Error(`HTTP ${resp.status}`), { status: resp.status });
    const json = await resp.json();
    setSynthesis(json.synthesis || null);

      topicId: r.topic || r.topicId || 'general',
      roleId: r.role || r.roleId || 'all_roles',
      fact: r.text || r.fact, index: 0,
      sourceRef: r.url ? { url: r.url, title: r.title } : (r.sourceRef || null),
      score: r.score, channel: r.channel || 'B',
      content_type: r.content_type,
      page: r.page,
    }));
  }, []);

  const handleSearch = useCallback(async () => {
    const trimmed = query.trim();
    if (!trimmed) return;
    setIsLoading(true);
    setBackendError(null);
    try {
      let found = [];
      if (searchChannel === 'A') {
        found = await runChannelA(trimmed, qaRole);
      } else if (searchChannel === 'B') {
        found = await runChannelB(trimmed);
      } else {
        found = await runCombined(trimmed);
      }
      setResults(found);
      setSearched(true);
    } catch (err) {
      if (err && err.status === 429) {
        setBackendError('查詢次數已達上限（每分鐘10次），請稍候約1分鐘後再試。');
      } else {
        setBackendError('搜尋服務暫未連線，請稍後再試。');
      }
      setResults([]);
      setSearched(true);

    }

// XML-escape for text injected into the docx parts.
function xmlEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}
// Normalize for span↔paragraph matching: drop whitespace + common CJK/ASCII punctuation.
function annNorm(s) {
  return String(s || '').replace(/\s+/g, '').replace(/[，。、；：．（）()\[\]【】「」『』·・…—\-_/]/g, '');
}
function annParaMatches(paraNorm, spanNorm) {
  if (spanNorm.length < 8 || paraNorm.length < 4) return false;
  if (paraNorm.indexOf(spanNorm) !== -1) return true;             // span ⊆ paragraph (split case)
  if (spanNorm.indexOf(paraNorm) !== -1 && paraNorm.length >= 12) return true; // paragraph ⊆ span (merged case)
  const probe = spanNorm.slice(0, 20);                            // tolerant prefix probe
  return probe.length >= 12 && paraNorm.indexOf(probe) !== -1;
}
// Plain text of a <w:p>…</w:p> XML fragment (concatenated <w:t> contents, entities decoded).
function paraPlainText(paraXml) {
  let out = '';
  const re = /<w:t\b[^>]*>([\s\S]*?)<\/w:t>/g;
  let m;
  while ((m = re.exec(paraXml)) !== null) out += m[1];
  return out.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
}

function AnnotatePanel() {
  const [domains, setDomains] = useState([]);
  const [selDomains, setSelDomains] = useState([]); // [] = 自動偵測
  const [autoMode, setAutoMode] = useState(true);
  const [schoolType, setSchoolType] = useState('');
  const [docText, setDocText] = useState('');
  const [fileName, setFileName] = useState('');
  const [fileBuffer, setFileBuffer] = useState(null); // original file ArrayBuffer (docx OR pdf, for in-place annotation)
  const [isDocx, setIsDocx] = useState(false);
  const [isPdf, setIsPdf] = useState(false);
  const [pdfPages, setPdfPages] = useState(null); // S163 Phase 2: per-page pdf.js text positions for PDF highlight
  const [extracting, setExtracting] = useState(false);
  const [extractError, setExtractError] = useState('');
  const [analyzing, setAnalyzing] = useState(false);
  const [error, setError] = useState('');
  const [report, setReport] = useState(null);
  const [downloading, setDownloading] = useState(false);
  const [downloadNote, setDownloadNote] = useState('');
  const fileInputRef = useRef(null);
  const MAX_CHARS = 60000;

  useEffect(() => {
    let alive = true;
    fetch(`${ANNOTATE_BACKEND_URL}/api/checklist-domains`)
      .then((r) => r.json())
      .then((d) => { if (alive && Array.isArray(d.domains)) setDomains(d.domains); })
      .catch(() => {});
    return () => { alive = false; };
  }, []);

  const resetOutputs = useCallback(() => { setReport(null); setError(''); setDownloadNote(''); }, []);

  async function extractPdf(buf) {
    const lib = window.pdfjsLib;
    if (!lib) throw new Error('PDF 解析元件尚未載入，請重新整理頁面再試。');
    if (lib.GlobalWorkerOptions && !lib.GlobalWorkerOptions.workerSrc) {
      lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const pdf = await lib.getDocument({ data: buf.slice(0) }).promise;
    let out = '';
    // S163 Phase 2: capture per-page text positions (PDF user space, origin
    // bottom-left) so matched spans can be highlighted back on the original PDF.
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: 1 });
      const tc = await page.getTextContent();
      const items = tc.items.map((t) => ({
        s: t.str,
        x: t.transform[4],
        y: t.transform[5],
        w: t.width || 0,
        h: t.height || Math.abs(t.transform[3]) || 10,
      }));
      pages.push({ w: vp.width, h: vp.height, rotation: vp.rotation || 0, items });
      out += tc.items.map((t) => t.str).join(' ') + '\n\n'; // text fed to backend — unchanged
    }
    return { text: out.trim(), pages };
  }
  async function extractDocx(buf) {
    if (!window.mammoth) throw new Error('Word 解析元件尚未載入，請重新整理頁面再試。');
    const res = await window.mammoth.extractRawText({ arrayBuffer: buf.slice(0) });
    return (res.value || '').trim();
  }
  async function handleFile(file) {
    if (!file) return;
    const name = file.name || '';
    const lower = name.toLowerCase();
    if (!lower.endsWith('.pdf') && !lower.endsWith('.docx')) {
      setExtractError('只支援 PDF 或 Word（.docx）檔；其他內容請直接貼上文字。'); return;
    }
    setExtracting(true); setExtractError(''); resetOutputs();
    try {
      const buf = await file.arrayBuffer();
      const docx = lower.endsWith('.docx');
      let text, pages = null;
      if (docx) { text = await extractDocx(buf); }
      else { const r = await extractPdf(buf); text = r.text; pages = r.pages; }
      if (text.length < 30) throw new Error('未能從檔案抽取文字（掃描影印本暫不支援），請改貼文字內容。');
      setDocText(text); setFileName(name); setIsDocx(docx); setIsPdf(!docx);
      setFileBuffer(buf); // S163 Phase 2: both .docx and .pdf can now be annotated in place
      setPdfPages(pages);
    } catch (e) {
      setExtractError(e && e.message ? e.message : '檔案讀取失敗，請改貼文字內容。');
      setFileName(''); setFileBuffer(null); setIsDocx(false); setIsPdf(false); setPdfPages(null);
    } finally {
      setExtracting(false);
      if (fileInputRef.current) fileInputRef.current.value = '';
    }
  }

  function toggleDomain(key) {
    resetOutputs();
    setSelDomains((prev) => prev.includes(key) ? prev.filter((k) => k !== key) : (prev.length >= 3 ? prev : [...prev, key]));
  }

  async function handleAnnotate() {
    const text = docText.trim();
    if (!text) { setError('請先上載或貼上文件內容'); return; }
    if (text.length > MAX_CHARS) { setError('文件過長，請分批處理'); return; }
    setAnalyzing(true); setError(''); setReport(null); setDownloadNote('');
    try {
      const body = {
        text,
        ...(fileName ? { filename: fileName } : {}),
        ...(schoolType ? { school_type: schoolType } : {}),
        ...(!autoMode && selDomains.length ? { domains: selDomains } : {}),
      };
      const resp = await fetch(`${ANNOTATE_BACKEND_URL}/api/annotate-document`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      const json = await resp.json().catch(() => null);
      if (!resp.ok) {
        if (resp.status === 429) throw new Error('標註次數已達上限（每分鐘10次），請稍候約1分鐘後再試。');
        throw new Error((json && json.error) || '標註服務暫未連線，請稍後再試。');
      }
      setReport(json);
    } catch (e) {
      setError(e && e.message ? e.message : '標註服務暫未連線，請稍後再試。');
    } finally { setAnalyzing(false); }
  }

  function handleClear() {
    setDocText(''); setFileName(''); setFileBuffer(null); setIsDocx(false); setIsPdf(false); setPdfPages(null); setExtractError(''); resetOutputs();
  }

  // S166 — single clean ready-to-use output. S169 ①: Word input now keeps its ORIGINAL
  // formatting (headings / numbering / tables) by editing the .docx XML in place via
  // buildCleanOriginalDocx; PDF / pasted text (no original Word structure) stay on the
  // from-text buildCleanDocx. Output is clean either way (no highlight / no track-change).
  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }
  function annotateMeta() {
    return {
      schoolType: report.school_type || schoolType,
      domains: (report.domains || []).map((d) => d.domain_cn),
      autoDetected: report.auto_detected,
      filename: report.filename || fileName,
    };
  }
  async function handleDownloadClean() {
    if (!report || downloading) return;
    if (!window.docx) { setError('文件生成元件尚未載入，請重新整理頁面再試。'); return; }
    if (!docText || !docText.trim()) { setError('沒有可用文字內容生成。'); return; }
    setDownloading(true); setError(''); setDownloadNote('');
    try {
      const base = String(report.filename || fileName || '文件').replace(/\.(pdf|docx?)$/i, '');
      const useOriginal = isDocx && fileBuffer;
      const { blob, merged, total } = useOriginal
        ? await buildCleanOriginalDocx(fileBuffer, report.findings || [], annotateMeta())
        : await buildCleanDocx(docText, report.findings || [], annotateMeta());
      downloadBlob(blob, `${base}_乾淨成品版.docx`);
      setDownloadNote(
        (useOriginal ? '已生成乾淨成品版（保留原 Word 格式）：' : '已生成乾淨成品版：') +
        `${merged} 項建議融入正文（標示「（建議補充）」）；全部 ${total} 項說明與 EDB 出處見文末附錄`
      );
    } catch (e) {
      setError('生成失敗：' + (e && e.message ? e.message : '未知錯誤'));
    } finally { setDownloading(false); }
  }

  // S169 ①(a) — "改咗甚麼" change/diff summary (separate short Word).
  async function handleDownloadChanges() {
    if (!report || downloading) return;
    if (!window.docx) { setError('文件生成元件尚未載入，請重新整理頁面再試。'); return; }

// S166 — 乾淨成品版 (clean ready-to-use draft). Leonard feedback: even after accepting all
// tracked changes the highlights stayed and inline 💡/⚠ notes cluttered the original. This
// version keeps the ORIGINAL body clean (no highlight), MERGES each located suggested clause
// into the flow as PLAIN text with a minimal "（建議補充）" lead (honest but unobtrusive), and
// moves ALL explanations + EDB sources into a single END appendix. Reads as a usable,
// editable policy draft. Supersedes the annotated/editable/list downloads (UI simplified to
// one button). Built from extracted text → Word/PDF/paste all supported. Reuses annNorm/annParaMatches.
// Shared partition for the clean outputs: decide which findings merge into the body
// as a ready clause vs. go to the appendix only. A finding merges iff it is a checklist
// item WITH a suggestion AND a span that locates in one of the body paragraphs.
// `paraNorms` = annNorm() of each body paragraph (XML-derived or text-derived).
// Returns { byPara: Map(paraIndex -> [finding…]), mergedSet: Set(finding) }.
function partitionCleanFindings(paraNorms, findings) {
  const byPara = new Map();
  const mergedSet = new Set();
  for (const f of findings || []) {
    if (f.kind === 'guideline' || !f.suggestion || !f.span) continue;
    const sNorm = annNorm(f.span);
    let hit = -1;
    for (let i = 0; i < paraNorms.length; i++) { if (annParaMatches(paraNorms[i], sNorm)) { hit = i; break; } }
    if (hit === -1) continue;
    if (!byPara.has(hit)) byPara.set(hit, []);
    byPara.get(hit).push(f);
    mergedSet.add(f);
  }
  return { byPara, mergedSet };
}

async function buildCleanDocx(docText, findings, meta) {
  const D = window.docx;
  if (!D) throw new Error('docx 程式庫未載入');
  const FONT = 'Microsoft JhengHei';
  const t = (text, o = {}) => new D.TextRun({ text, font: FONT, ...o });
  const p = (children, o = {}) => new D.Paragraph({ children: Array.isArray(children) ? children : [children], ...o });
  meta = meta || {};

  const rawParas = String(docText || '').split(/\n+/).map((s) => s.trim()).filter(Boolean);
  const paraNorms = rawParas.map((s) => annNorm(s));

  // Only checklist findings WITH a suggestion AND a located span merge into the body (as a
  // ready clause). Guideline references + unlocated + no-suggestion go to the appendix only.
  const { byPara } = partitionCleanFindings(paraNorms, findings);

  const children = [];
  const schoolLabel = (meta.schoolType && ANNOTATE_SCHOOL_LABELS[meta.schoolType]) || '不限（一般比對）';
  const domLabel = (meta.domains && meta.domains.length) ? meta.domains.join('、') + (meta.autoDetected ? '（自動偵測）' : '') : '自動偵測';
  const title = meta.filename ? String(meta.filename).replace(/\.(pdf|docx?)$/i, '') : '學校政策文件';
  children.push(p(t(title, { bold: true, size: 32 }), { spacing: { after: 60 } }));
  children.push(p(t('本文件已整合 AI 根據 EDB 指引提出的建議（標示「（建議補充）」），詳細說明與官方出處見文末附錄。請自行核對後採用；重要決定以教育局官方原文為準。', { size: 16, color: '888888' }), { spacing: { after: 60 } }));
  children.push(p(t('校類：' + schoolLabel + '　·　範疇：' + domLabel, { size: 16, color: '888888' }), { spacing: { after: 200 } }));

  let merged = 0;
  for (let i = 0; i < rawParas.length; i++) {
    children.push(p(t(rawParas[i])));            // original paragraph — CLEAN, no highlight/notes
    const here = byPara.get(i);
    if (here && here.length) {
      for (const f of here) {
        merged++;
        const lines = String(f.suggestion).split('\n').map((s) => s.trim()).filter(Boolean);
        lines.forEach((ln, idx) => {
          children.push(p(t((idx === 0 ? '（建議補充）' : '') + ln), { indent: { left: 360 }, spacing: idx === 0 ? { before: 40 } : {} }));
        });
      }
    }
  }

  // Appendix — full record of every finding (explanation + EDB source), grouped by domain.
  children.push(p(t('附錄：AI 建議說明與出處', { bold: true, size: 26, color: '1F4E36' }), { spacing: { before: 320, after: 40 } }));
  children.push(p(t('以下為 AI 根據 EDB 指引提出的建議與參考，連同官方出處供核對。標示「（建議補充）」者已加入上文相應位置；其餘為相關指引或未能在原文定位的建議。', { size: 16, color: '888888' }), { spacing: { after: 120 } }));
  const groups = {};
  for (const f of findings) {
    const dom = f.domain_cn || (f.kind === 'guideline' ? '相關指引' : '清單');
    (groups[dom] = groups[dom] || []).push(f);
  }
  for (const dom of Object.keys(groups)) {
    children.push(p(t('【' + dom + '】', { bold: true, size: 22, color: '1F4E36' }), { spacing: { before: 160 } }));
    for (const f of groups[dom]) {
      const tag = f.kind === 'guideline' ? '相關指引' : (f.status === 'partial' ? '部分涵蓋' : '未涵蓋');
      children.push(p([t('〔' + tag + '〕', { bold: true, color: f.kind === 'guideline' ? '1F4E36' : '8A5A00' }), t(' ' + (f.note || ''), { size: 19 })], { spacing: { before: 100 } }));
      if (f.suggestion) {
        children.push(p(t('建議條文：', { size: 17, bold: true, color: '555555' }), { indent: { left: 360 } }));
        for (const ln of String(f.suggestion).split('\n')) if (ln.trim()) children.push(p(t(ln.trim(), { size: 18 }), { indent: { left: 540 } }));
      }
      if (f.source && f.source.title) {
        const link = String(f.source.url || '') + (f.source.page && /\.pdf/i.test(f.source.url || '') ? `#page=${f.source.page}` : '');
        const isHttp = /^https?:/i.test(link);
        children.push(p([t('出處：', { size: 16, color: '888888' }),
          isHttp ? new D.ExternalHyperlink({ link, children: [new D.TextRun({ text: `《${f.source.title}》${f.source.page ? '第' + f.source.page + '頁' : ''}`, size: 16, style: 'Hyperlink', font: FONT })] })
                 : t(`《${f.source.title}》${f.source.page ? '第' + f.source.page + '頁' : ''}`, { size: 16, color: '888888' })], { indent: { left: 360 } }));
      }
    }
  }

  const doc = new D.Document({ styles: { default: { document: { run: { font: FONT, size: 22 } } } }, sections: [{ children }] });
  return { blob: await D.Packer.toBlob(doc), merged, total: findings.length };
}

// S169 ① — CLEAN ready-to-use output that PRESERVES the original .docx formatting.
// Unlike buildCleanDocx (which rebuilds from extracted text and flattens headings /
// numbering / tables), this operates on the original word/document.xml via JSZip so
// every original paragraph keeps its style. It stays CLEAN: original runs are left
// 100% untouched (NO highlight), and merged suggestions are inserted as PLAIN
// "（建議補充）" paragraphs (NO w:ins track-changes), so opening the file shows a
// tidy finished draft with no marks to accept/clear. Explanations + EDB sources go to
// the appendix. Returns { blob, merged, total }.
async function buildCleanOriginalDocx(arrayBuffer, findings, meta) {
  const JSZip = window.JSZip;
  if (!JSZip) throw new Error('文件元件 (JSZip) 尚未載入，請重新整理頁面再試。');
  const zip = await JSZip.loadAsync(arrayBuffer);
  const docFile = zip.file('word/document.xml');
  if (!docFile) throw new Error('此 .docx 結構不支援保留格式輸出（找不到 document.xml）。');
  let xml = await docFile.async('string');
  meta = meta || {};
  const wp = /<w:p\b(?:\s[^>]*)?>[\s\S]*?<\/w:p>/g;

  // Pass 1 — normalized text of every body paragraph (same regex/order as pass 2).
  const paraNorms = [];
  let pm;
  while ((pm = wp.exec(xml)) !== null) paraNorms.push(annNorm(paraPlainText(pm[0])));

  const { byPara } = partitionCleanFindings(paraNorms, findings);

  // Plain "（建議補充）" note paragraph(s) — no highlight, no tracked-change, no fill;
  // blends into the body as ordinary text (honestly marked on the first line only).
  function cleanNoteParas(f) {
    const out = [];
    const lines = String(f.suggestion).split('\n').map((s) => s.trim()).filter(Boolean);
    lines.forEach((ln, idx) => {
      const pPr = '<w:pPr><w:spacing w:before="' + (idx === 0 ? 40 : 0) + '" w:after="0"/><w:ind w:left="360"/></w:pPr>';
      out.push('<w:p>' + pPr + '<w:r><w:t xml:space="preserve">' + xmlEsc((idx === 0 ? '（建議補充）' : '') + ln) + '</w:t></w:r></w:p>');
    });
    return out.join('');
  }

  // Pass 2 — keep original paragraph verbatim; append clean note paragraph(s) after it.
  let merged = 0;
  let pIndex = -1;
  xml = xml.replace(wp, (paraXml) => {
    pIndex++;
    const here = byPara.get(pIndex);
    if (!here || !here.length) return paraXml;       // untouched → format fully preserved
    let notes = '';
    for (const f of here) { merged++; notes += cleanNoteParas(f); }
    return paraXml + notes;
  });

  // Intro note at the very top of the body (clean framing, not a highlight legend).
  const ip = function (text, o) {
    o = o || {};
    const rpr = (o.bold ? '<w:b/>' : '') + (o.size ? '<w:sz w:val="' + o.size + '"/>' : '') + (o.color ? '<w:color w:val="' + o.color + '"/>' : '');
    return '<w:p>' + (o.after ? '<w:pPr><w:spacing w:after="' + o.after + '"/></w:pPr>' : '') +
      '<w:r>' + (rpr ? '<w:rPr>' + rpr + '</w:rPr>' : '') + '<w:t xml:space="preserve">' + xmlEsc(text) + '</w:t></w:r></w:p>';
  };
  const schoolLabel = (meta.schoolType && ANNOTATE_SCHOOL_LABELS[meta.schoolType]) || '不限（一般比對）';
  const domLabel = (meta.domains && meta.domains.length) ? meta.domains.join('、') + (meta.autoDetected ? '（自動偵測）' : '') : '自動偵測';
  const introXml =
    ip('本文件保留原有格式，並已整合 AI 根據 EDB 指引提出的建議（標示「（建議補充）」），詳細說明與官方出處見文末附錄。請自行核對後採用；重要決定以教育局官方原文為準。', { size: 16, color: '888888' }) +
    ip('校類：' + schoolLabel + '　·　範疇：' + domLabel, { size: 16, color: '888888', after: 160 });
  xml = xml.replace(/(<w:body\b(?:\s[^>]*)?>)/, '$1' + introXml);

  // Appendix — full record of every finding (explanation + EDB source), grouped by domain.
  // Inserted before the final <w:sectPr> so page geometry is preserved.
  {
    const ap = [];
    const para = function (text, o) {
      o = o || {};
      const rpr = (o.bold ? '<w:b/>' : '') + (o.size ? '<w:sz w:val="' + o.size + '"/>' : '') + (o.color ? '<w:color w:val="' + o.color + '"/>' : '');
      return '<w:p>' + (o.before ? '<w:pPr><w:spacing w:before="' + o.before + '"/></w:pPr>' : '') +
        '<w:r>' + (rpr ? '<w:rPr>' + rpr + '</w:rPr>' : '') + '<w:t xml:space="preserve">' + xmlEsc(text) + '</w:t></w:r></w:p>';
    };
    ap.push('<w:p/>');
    ap.push(para('附錄：AI 建議說明與出處', { bold: true, size: 26, color: '1F4E36' }));
    ap.push(para('以下為 AI 根據 EDB 指引提出的建議與參考，連同官方出處供核對。標示「（建議補充）」者已加入上文相應位置；其餘為相關指引或未能在原文定位的建議。', { size: 16, color: '888888' }));
    const groups = {};
    for (const f of findings || []) {
      const dom = f.domain_cn || (f.kind === 'guideline' ? '相關指引' : '清單');
      (groups[dom] = groups[dom] || []).push(f);
    }
    for (const dom of Object.keys(groups)) {
      ap.push(para('【' + dom + '】', { bold: true, size: 22, color: '1F4E36', before: 160 }));
      for (const f of groups[dom]) {
        const tag = f.kind === 'guideline' ? '相關指引' : (f.status === 'partial' ? '部分涵蓋' : '未涵蓋');
        ap.push(para('〔' + tag + '〕' + (f.note || ''), { size: 19, before: 100 }));
        if (f.suggestion) {
          ap.push(para('建議條文：', { size: 17, bold: true, color: '555555' }));
          for (const ln of String(f.suggestion).split('\n')) if (ln.trim()) ap.push(para(ln.trim(), { size: 18 }));
        }
        if (f.source && f.source.title) {
          ap.push(para('出處：《' + f.source.title + '》' + (f.source.page ? '（第' + f.source.page + '頁）' : ''), { size: 16, color: '888888' }));
        }
      }
    }
    const apXml = ap.join('');
    const lastSect = xml.lastIndexOf('<w:sectPr');
    if (lastSect !== -1) xml = xml.slice(0, lastSect) + apXml + xml.slice(lastSect);
    else xml = xml.replace('</w:body>', apXml + '</w:body>');
  }

  zip.file('word/document.xml', xml);
  const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  return { blob, merged, total: (findings || []).length };
}

// S169 ①(a) — "改咗甚麼" change/diff summary. A short Word that lists, at a glance,
// every change the clean output made: which suggestions were merged into the body
// (with the original paragraph they attach to) and which were placed in the appendix.
// Input-agnostic: classifies findings against the extracted docText (same normalized
// matching the clean builders use), so it stays consistent for Word / PDF / pasted text.
async function buildChangeSummaryDocx(docText, findings, meta) {
  const D = window.docx;
  if (!D) throw new Error('docx 程式庫未載入');
  const FONT = 'Microsoft JhengHei';
  const t = (text, o = {}) => new D.TextRun({ text, font: FONT, ...o });
  const p = (children, o = {}) => new D.Paragraph({ children: Array.isArray(children) ? children : [children], ...o });
  meta = meta || {};
  findings = findings || [];

  const rawParas = String(docText || '').split(/\n+/).map((s) => s.trim()).filter(Boolean);
  const paraNorms = rawParas.map((s) => annNorm(s));
  const { byPara, mergedSet } = partitionCleanFindings(paraNorms, findings);
  const appendix = findings.filter((f) => !mergedSet.has(f));

  const children = [];
  const title = meta.filename ? String(meta.filename).replace(/\.(pdf|docx?)$/i, '') : '學校政策文件';
  children.push(p(t(title + '　·　改動摘要', { bold: true, size: 30 }), { spacing: { after: 40 } }));
  children.push(p(t('本頁列出「乾淨成品版」對原文所作的改動，方便核對。融入正文者以「（建議補充）」標示於原文相應段落之後；其餘列於成品版文末附錄。', { size: 16, color: '888888' }), { spacing: { after: 60 } }));
  children.push(p(t('合共：融入正文 ' + mergedSet.size + ' 項建議；附錄補充 ' + appendix.length + ' 項。', { size: 18, bold: true, color: '1F4E36' }), { spacing: { after: 200 } }));

  // Section 1 — merged into the body, shown next to the original paragraph each attaches to.
  children.push(p(t('一、融入正文的建議（' + mergedSet.size + '）', { bold: true, size: 24, color: '1F4E36' }), { spacing: { after: 80 } }));
  if (mergedSet.size === 0) {
    children.push(p(t('（無——本次沒有建議可定位融入正文。）', { size: 18, color: '888888' }), { spacing: { after: 120 } }));
  } else {
    const sortedIdx = Array.from(byPara.keys()).sort((a, b) => a - b);
    let n = 0;
    for (const idx of sortedIdx) {
      const orig = rawParas[idx] || '';
      children.push(p(t('▸ 原文段落：' + (orig.length > 90 ? orig.slice(0, 90) + '…' : orig), { size: 18, color: '555555' }), { spacing: { before: 140 }, indent: { left: 120 } }));
      for (const f of byPara.get(idx)) {
        n++;
        const st = f.status === 'partial' ? '部分涵蓋' : '未涵蓋';
        children.push(p(t(n + '. 加入建議（' + (f.domain_cn || '清單') + '·' + st + '）：' + (f.note || ''), { size: 18, bold: true, color: '8A5A00' }), { indent: { left: 360 }, spacing: { before: 40 } }));
        for (const ln of String(f.suggestion).split('\n')) if (ln.trim()) children.push(p(t('＋ ' + ln.trim(), { size: 18, color: '1F4E36' }), { indent: { left: 540 } }));
        if (f.source && f.source.title) children.push(p(t('出處：《' + f.source.title + '》' + (f.source.page ? '（第' + f.source.page + '頁）' : ''), { size: 15, color: '888888' }), { indent: { left: 540 } }));
      }
    }
  }

  // Section 2 — appendix-only items (guideline refs, unlocated, no-suggestion).
  children.push(p(t('二、列於附錄的補充（' + appendix.length + '）', { bold: true, size: 24, color: '1F4E36' }), { spacing: { before: 240, after: 80 } }));
  if (appendix.length === 0) {
    children.push(p(t('（無。）', { size: 18, color: '888888' })));
  } else {
    let m = 0;
    for (const f of appendix) {
      m++;
      const tag = f.kind === 'guideline' ? '相關指引' : (f.status === 'partial' ? '部分涵蓋' : '未涵蓋');
      children.push(p(t(m + '. 〔' + tag + '·' + (f.domain_cn || (f.kind === 'guideline' ? '指引' : '清單')) + '〕' + (f.note || ''), { size: 18 }), { spacing: { before: 80 }, indent: { left: 120 } }));
      if (f.source && f.source.title) children.push(p(t('出處：《' + f.source.title + '》' + (f.source.page ? '（第' + f.source.page + '頁）' : ''), { size: 15, color: '888888' }), { indent: { left: 360 } }));
    }
  }

  const doc = new D.Document({ styles: { default: { document: { run: { font: FONT, size: 22 } } } }, sections: [{ children }] });
  return { blob: await D.Packer.toBlob(doc), merged: mergedSet.size, total: findings.length };
}

// S169 ② — first-use onboarding tour. A dismissible walkthrough of the 5 channels,
// shown automatically on first visit (localStorage gate) and re-openable any time from
// the header "使用教學" button. Pure client-side; no backend / data-contract contact.
const TOUR_FLAG = 'k1_tour_done_v1';
const TOUR_STEPS = [
  { icon: '👋', title: '歡迎使用香港學校政策搜尋平台', body: '呢個平台幫學校快速查閱教育局（EDB）政策指引、為學校文件做合規標註、亦可下載政策範本。一分鐘導覽，帶你睇下五大功能點用。', cta: null },
  { icon: '🔍', title: '政策搜尋', body: '輸入關鍵字（例如「校車安全」「法團校董會」），平台會喺 EDB 指引與通告中搵出相關內容，附來源頁碼，可直接跳去官方原文 PDF。', cta: { label: '去政策搜尋', view: 'qa' } },
  { icon: '📝', title: '文件標註', body: '上載學校政策文件（Word 最佳），AI 比對 EDB 指引同合規清單，標出建議，生成一份「乾淨成品版」供你下載編輯——Word 上載會保留原有標題／編號／格式。', cta: { label: '去文件標註', view: 'annotate' } },
  { icon: '📋', title: '範本下載', body: '各範疇（校園安全、收生、財務等）嘅政策範本，按校類揀選下載，慳返由零起草嘅時間。', cta: { label: '去範本下載', view: 'templates' } },
  { icon: '📚', title: 'EDB 指引文件庫', body: '分類整理嘅 EDB 官方指引文件，可預覽並跳去官方原文，按範疇與時序排列。', cta: { label: '去指引文件庫', view: 'guidelines' } },
  { icon: '✅', title: '開始使用', body: '隨時可喺右上角「🎓 使用教學」重溫導覽；想睇詳細步驟可去「ℹ️ 平台介紹」嘅「使用手冊」。所有資料僅供參考，重要決定請以教育局官方原文為準。', cta: { label: '睇使用手冊（平台介紹）', view: 'about' } },
];

function Onboarding({ open, onClose, onGoto }) {
  const [step, setStep] = useState(0);
  useEffect(() => { if (open) setStep(0); }, [open]);
  useEffect(() => {
    if (!open) return undefined;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open) return null;
  const s = TOUR_STEPS[step];
  const last = step === TOUR_STEPS.length - 1;
  const navBtn = { padding: '8px 16px', fontSize: '0.85rem', fontWeight: 600, borderRadius: '8px', cursor: 'pointer', border: '1px solid var(--border,#d8cfc0)' };
  return (
    <div role="dialog" aria-modal="true" aria-label="使用教學" onClick={onClose}
         style={{ position: 'fixed', inset: 0, zIndex: 2000, background: 'rgba(20,18,15,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
      <div onClick={(e) => e.stopPropagation()}
           style={{ background: 'var(--paper,#fff)', borderRadius: '16px', maxWidth: '460px', width: '100%', padding: '28px 26px', boxShadow: '0 20px 60px rgba(0,0,0,0.35)' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' }}>
          <span style={{ fontSize: '0.75rem', fontWeight: 600, color: 'var(--mid,#777)' }}>使用教學　{step + 1}/{TOUR_STEPS.length}</span>
          <button onClick={onClose} aria-label="關閉" style={{ background: 'none', border: 'none', fontSize: '1.3rem', lineHeight: 1, cursor: 'pointer', color: 'var(--mid,#999)' }}>×</button>
        </div>
        <div style={{ fontSize: '2.6rem', marginBottom: '6px' }}>{s.icon}</div>
        <h2 style={{ fontSize: '1.28rem', fontWeight: 800, color: 'var(--ink,#2a2a2a)', marginBottom: '10px', lineHeight: 1.35 }}>{s.title}</h2>
        <p style={{ fontSize: '0.92rem', lineHeight: 1.8, color: 'var(--mid,#555)', marginBottom: s.cta ? '14px' : '4px' }}>{s.body}</p>
        {s.cta && (
          <button onClick={() => onGoto(s.cta.view)}
                  style={{ display: 'inline-block', padding: '7px 14px', fontSize: '0.85rem', fontWeight: 600, borderRadius: '8px', cursor: 'pointer', border: 'none', background: 'var(--cd-warm,#f3ece0)', color: 'var(--charcoal,#3a3a3a)' }}>
            {s.cta.label} →
          </button>
        )}
        <div style={{ display: 'flex', gap: '6px', justifyContent: 'center', margin: '20px 0' }}>
          {TOUR_STEPS.map((_, i) => (
            <span key={i} style={{ width: i === step ? '22px' : '7px', height: '7px', borderRadius: '4px', background: i === step ? 'var(--p-primary,#1F4E36)' : 'var(--line,#e0d8c8)', transition: 'all .2s' }} />
          ))}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
          <button onClick={onClose} style={{ ...navBtn, background: 'transparent', color: 'var(--mid,#888)' }}>略過</button>
          <div style={{ marginLeft: 'auto', display: 'flex', gap: '8px' }}>
            {step > 0 && <button onClick={() => setStep(step - 1)} style={{ ...navBtn, background: 'var(--paper,#fff)', color: 'var(--ink,#333)' }}>上一步</button>}
            {!last
              ? <button onClick={() => setStep(step + 1)} style={{ ...navBtn, background: 'var(--p-primary,#1F4E36)', color: '#fff', border: 'none' }}>下一步</button>
              : <button onClick={onClose} style={{ ...navBtn, background: 'var(--p-primary,#1F4E36)', color: '#fff', border: 'none' }}>完成 ✓</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Main App ──
function App() {
  const data = INITIAL_DATA;
  const VALID_VIEWS = ['qa', 'annotate', 'templates', 'guidelines', 'about'];
  let hashView = window.location.hash.replace('#', '');
  // S161: 文件分析 + 文件修訂 merged into 文件標註; redirect the retired hashes one season.
  if (hashView === 'analyze' || hashView === 'review') hashView = 'annotate';
  const [viewMode, setViewMode] = useState(
    VALID_VIEWS.includes(hashView) ? hashView : 'qa'
  ); // 'qa' | 'annotate' | 'templates' | 'guidelines' | 'about'

  // Keep URL hash in sync when tab changes
  const switchView = useCallback((v) => {
    setViewMode(v);
    window.history.replaceState(null, '', `#${v}`);
    window.scrollTo(0, 0);
  }, []);
  const [previewDoc, setPreviewDoc] = useState(null);

  // S169 ② — onboarding tour: auto-open on first visit, re-openable from header.
  const [showTour, setShowTour] = useState(false);
  useEffect(() => {
    try { if (!localStorage.getItem(TOUR_FLAG)) setShowTour(true); } catch (e) { /* private-mode: skip */ }
  }, []);
  const closeTour = useCallback(() => {
    setShowTour(false);
    try { localStorage.setItem(TOUR_FLAG, '1'); } catch (e) { /* ignore */ }
  }, []);
  const openTour = useCallback(() => setShowTour(true), []);
  const tourGoto = useCallback((v) => { closeTour(); switchView(v); }, [closeTour, switchView]);

  // S163 P1: header/footer show the user-facing PLATFORM_VERSION (v3.0.0), NOT the
  // frozen knowledge.json data-contract version (data._meta.version stays 2.3.0).
  const displayVersion = `v${PLATFORM_VERSION}`;

  // Stats — public read-only (derived from _meta.stats / data; no review workflow)
  const stats = useMemo(() => {
    let totalFacts = 0;
    Object.entries(data).forEach(([k, v]) => {
      if (k === '_meta') return;
      Object.entries(v).forEach(([rk, fs]) => {
        if (rk.startsWith('_')) return;
        if (Array.isArray(fs)) totalFacts += fs.length;
      });
    });
    return { approvedCount: totalFacts, metaStats: data._meta?.stats, metaVersion: data._meta?.version };
  }, [data]);

  return (
    <div className="min-h-screen">
      <Onboarding open={showTour} onClose={closeTour} onGoto={tourGoto} />
      {/* ── K1 Header ── */}
      <header className="k1-header" id="k1Header">
        <div className="k1-header-inner">
          {/* Logo */}
          <div className="k1-logo" onClick={() => { window.location.href = 'index.html'; }} style={{cursor:'pointer'}}>
            <span className="k1-logo-dot">EDB</span>
            <div>
              <div className="k1-logo-text">香港學校政策搜尋平台</div>
              <div className="k1-logo-sub">政策核對 · {displayVersion}</div>
            </div>
          </div>

          {/* Actions */}
          <div className="k1-header-actions">
            {/* View mode tabs */}
            <div className="k1-tab-bar">
              <button onClick={() => switchView('about')}
                      className={`filter-tab ${viewMode === 'about' ? 'active-tab' : ''}`} aria-selected={viewMode === 'about'} role="tab">
                ℹ️ 平台介紹
              </button>
              <button onClick={() => switchView('qa')}
                      className={`filter-tab ${viewMode === 'qa' ? 'active-tab' : ''}`} aria-selected={viewMode === 'qa'} role="tab">
                🔍 政策搜尋
              </button>
              <button onClick={() => switchView('annotate')}
                      className={`filter-tab ${viewMode === 'annotate' ? 'active-tab' : ''}`} aria-selected={viewMode === 'annotate'} role="tab">
                📝 文件標註
              </button>
              <button onClick={() => switchView('templates')}
                      className={`filter-tab ${viewMode === 'templates' ? 'active-tab' : ''}`} aria-selected={viewMode === 'templates'} role="tab">
                📋 範本下載
              </button>
              <button onClick={() => switchView('guidelines')}
                      className={`filter-tab ${viewMode === 'guidelines' ? 'active-tab' : ''}`} aria-selected={viewMode === 'guidelines'} role="tab">
                📚 EDB指引 ({GUIDELINES_REGISTRY.length})
              </button>
            </div>
            <button onClick={openTour} title="重溫使用教學導覽"
                    className="k1-help-btn" aria-label="使用教學">
              🎓 使用教學
            </button>

          </div>
        </div>
      </header>

      <div className="k1-layout">
       <div className="k1-layout-inner">
        {/* ── Main content ── */}

          {viewMode === 'about' ? (
            <PlatformIntroPanel stats={stats} />
          ) : viewMode === 'guidelines' ? (
            <GuidelinesPanel setPreviewDoc={setPreviewDoc} />
          ) : viewMode === 'annotate' ? (
            <AnnotatePanel />
