            <TemplatesPanel />
          ) : (
            <QAPanel data={data} setPreviewDoc={setPreviewDoc} />
          )}
        </div>
       </div>
      </div>

      {/* ── Footer ── */}
      <footer className="k1-footer">
        <div className="k1-footer-inner" style={{flexDirection:'column',gap:'10px',alignItems:'flex-start'}}>
          <div style={{fontSize:'0.78rem',lineHeight:1.6,opacity:0.85,maxWidth:'100%'}}>
            <strong style={{fontWeight:700,color:'rgba(240,238,233,0.95)'}}>免責聲明：</strong>本平台整理教育局公開指引與通告文件資料。所有資料僅供一般參考，不構成正式法律或行政意見。用戶應自行參閱教育局官方原文以作準。本站採用免 Cookie 匿名流量統計。&nbsp;·&nbsp;設計及維護：Leonard Wong
          </div>
          <div style={{display:'flex',gap:'18px',alignItems:'center',flexWrap:'wrap'}}>
            <span style={{fontWeight:600,color:'rgba(240,238,233,0.75)',fontSize:'0.78rem'}}>政策搜尋平台 {displayVersion}</span>
            <a href="index.html">← 返回首頁</a>
            <a href="https://www.edb.gov.hk" target="_blank" rel="noopener">EDB 教育局網站</a>
          </div>
        </div>
      </footer>

      {/* Slide-in Drawer Preview — only render backdrop when a doc is open */}
      {previewDoc && (
        <div
          className="fixed inset-0 pointer-events-auto"
          style={{ backgroundColor: 'rgba(61,43,34,0.45)', zIndex: 999 }}
          onClick={() => setPreviewDoc(null)}
        />
      )}

      <div
        className="fixed top-0 right-0 h-full flex flex-col"
        style={{
          width: '66%', background: 'var(--cd-warm)',
          boxShadow: 'var(--shadow-lg)',
          borderLeft: '1px solid var(--border)',
          transform: previewDoc ? 'translateX(0)' : 'translateX(100%)',
          transition: 'transform 0.3s cubic-bezier(0.4,0,0.2,1)',
          zIndex: 1000
        }}
      >
        <div className="k1-drawer-header flex items-center justify-between flex-shrink-0"
             style={{padding:'16px 24px'}}>
          <div className="flex flex-col min-w-0 pr-4">
            <span className="text-xs font-bold tracking-wider uppercase mb-1" style={{color:'var(--edb)'}}>推入預覽</span>
            <h3 className="font-medium text-gray-900 truncate text-sm">{previewDoc?.title || '載入中...'}</h3>
          </div>
          <div className="flex items-center gap-3 flex-shrink-0">
            {previewDoc && (
              <a href={previewDoc.url} target="_blank" rel="noopener"
                 className="px-4 py-2 text-xs rounded border border-gray-200 font-medium transition-colors shadow-sm"
                 style={{background:'var(--paper-2)', color:'var(--ink-2)'}}>
                另開新頁
              </a>
            )}
            <button onClick={() => setPreviewDoc(null)}
                    className="p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-full transition-colors"
                    style={{fontSize:'18px', lineHeight:'1'}}>✕</button>
          </div>
        </div>
        <div className="flex-1 relative w-full flex items-center justify-center" style={{background:'var(--paper-2)'}}>
          {previewDoc && (() => {
            const url = previewDoc.url;
            const isEdbHtml = url.includes('edb.gov.hk') && !url.toLowerCase().includes('.pdf');
            const isPdf = url.toLowerCase().includes('.pdf');
            if (isEdbHtml) {
              return (
                <div className="text-center px-8 py-12 max-w-md">
                  <div style={{fontSize:'48px', marginBottom:'16px'}}>🔒</div>
                  <h3 className="font-bold text-lg mb-2" style={{color:'var(--ink)'}}>EDB 網站不允許嵌入預覽</h3>
                  <p className="text-sm mb-6" style={{color:'var(--ink-2)'}}>
                    香港教育局網站設有安全限制，禁止在其他網頁內嵌入其內容。<br/>請點擊下方按鈕在新分頁開啟。
                  </p>
                  <a href={url} target="_blank" rel="noopener"
                     className="inline-flex items-center gap-2 px-6 py-3 rounded-lg font-medium text-white shadow-md transition-all hover:opacity-90"
                     style={{background:'var(--edb)'}}>
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                    </svg>
                    在新分頁開啟文件
                  </a>
                </div>
              );
            }
            const iframeSrc = isPdf
              ? `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`
              : url;
            return (
              <iframe
                src={iframeSrc}
                className="absolute inset-0 w-full h-full border-0"
                title="PDF 預覽"
              />
            );
          })()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

    hdr.classList.toggle('scrolled', window.scrollY > 10);
  }, { passive: true });
}
</script>
