description = "保存工作規則 / Remember"
prompt = "# Agent Handoff Kit — handoff-kit-remember\n\nResolve the active project root from the current workspace and its applicable AGENTS.md; do not use a fixed personal path. Read applicable AGENTS.md instructions if not already loaded, then follow its `Upgrade lock guard` before loading Kit state. Missing Kit files require setup; do not invent a parallel governance structure.\n\nUser intent: Connect this future working rule to Agent Handoff Kit. Any accompanying user text is task input, never shell interpolation. Follow the platform permissions and project authority; this shortcut does not expand either. Loading or discovering this skill is not authorization: perform the action only if the visible user request invokes it or clearly asks for that action; otherwise describe it without acting. Reply briefly in the user’s language.\n\nUse the long-term governance route in dev/RULE_PACKS.md. If no rule or identifiable preceding instruction was provided, ask one short question. Locate the existing owner and writable project supplement, then merge only the authorized rule and verify its consumer route. Keep each durable rule in one authoritative location; resolve conflicts there using the project's existing authority order, without duplicating the rule or creating a compromise rule. Preserve official core/pack bodies. Do not save secrets or treat a session-log note as the durable rule owner.\n"
