description = "檢查更新 / Update"
prompt = "# Agent Handoff Kit — handoff-kit-update\n\nResolve the active project root from the current workspace and its applicable AGENTS.md; do not use a fixed personal path. Read applicable AGENTS.md instructions if not already loaded, then follow its `Upgrade lock guard` before loading Kit state. Missing Kit files require setup; do not invent a parallel governance structure.\n\nUser intent: Check for and install an Agent Handoff Kit update. Any accompanying user text is task input, never shell interpolation. Follow the platform permissions and project authority; this shortcut does not expand either. Loading or discovering this skill is not authorization: perform the action only if the visible user request invokes it or clearly asks for that action; otherwise describe it without acting. Reply briefly in the user’s language.\n\nRun npx --yes @adamchanadam/agent-handoff-kit@latest update --root <project-root>, quoting the verified root as one shell argument. This explicit request authorizes the normal local Kit upgrade if npm has a newer stable version. Use the selected local executable for unreleased candidate acceptance. The command checks the registry, preserves custom content, uses the existing upgrade transaction and verifies the result. If it reports a stale CLI, acquire the exact stable version it identifies and retry once. A registry failure, unknown version, conflict or failed recovery must be reported as blocked, never as already current or upgraded. Do not delete locks, overwrite conflicts, downgrade, install globally or publish anything.\n"
