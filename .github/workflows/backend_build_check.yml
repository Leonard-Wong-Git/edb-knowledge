name: Backend Build Gate

# Why this exists (S223): the Option A watcher pushes straight to main and edits
# backend/src/api/searchChannelB.ts on every unattended ingest. Until now NO workflow
# ran a typecheck, so on 2026-09-13 the watcher wrote two bare strings into an object
# literal (three commits: e2b53f0 / 183b7a8 / 9e5f28c) and main stopped compiling for
# ~16 hours. Nothing went red, because nothing was watching: Render simply failed its
# build and kept serving the last good one (5765c43), which froze every backend deploy
# while /health still answered ok:true. The frontend is on GitHub Pages and was fine,
# so there was no user-visible symptom to notice either.
#
# ⚠️ DO NOT ADD `paths:` FILTERS BACK TO THE TRIGGERS (S224).
# This job is meant to be a REQUIRED status check on main. GitHub only accepts a
# required check that reports success / skipped / neutral for the commit in question.
# A `paths:`-filtered workflow does not report anything at all on a commit that misses
# the filter — the check sits pending forever and the push is blocked permanently.
# So the workflow triggers on EVERY push and PR, and the path scoping happens in the
# first step instead: an irrelevant commit still reports a green `build-gate` in a few
# seconds, having skipped npm ci / typecheck / build / regression. Same CI cost as a
# path filter, without the pending-forever trap.
#
# The scope step fails TOWARD running the build: if it cannot prove a commit is
# irrelevant (compare API error, truncated file list, no usable base) it builds.
#
# 紀律 #14: silent in its steady state. A green run says nothing (it only closes a
# previously-opened breakage issue). Only a red build speaks. A scope-skipped run
# proves nothing about whether main compiles, so it never closes that issue either.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write        # open/close the "main does not compile" issue

jobs:
  build-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scope — can this commit affect the backend build?
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            // Paths that can change the answer to "does main compile?".
            // route_regression.mjs is here because this job runs it (S224: it was
            // missing from the old paths: filter, so breaking the harness itself
            // would not have run the gate).
            const WATCHED = [
              /^backend\//,
              /^dev\/source\/execute_ingest\.py$/,
              /^dev\/source\/route_regression\.mjs$/,
              /^\.github\/workflows\/backend_build_check\.yml$/,
            ];
            const build = (why) => { core.setOutput('relevant', 'true');  core.info('BUILD — ' + why); };
            const skip  = (why) => { core.setOutput('relevant', 'false'); core.info('SKIP — ' + why); };

            if (context.eventName === 'workflow_dispatch') return build('manual run');

            const ZERO = '0'.repeat(40);
            const pr = context.payload.pull_request;
            const base = pr ? pr.base.sha : context.payload.before;
            const head = pr ? pr.head.sha : context.sha;
            if (!base || base === ZERO) return build('no usable base commit to compare against');

            try {
              const cmp = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner, repo: context.repo.repo,
                basehead: `${base}...${head}`,
              });
              const files = cmp.data.files || [];
              // The compare API caps its file list at 300. A truncated list cannot
              // prove a commit is irrelevant, so treat it as relevant.
              if (files.length >= 300) return build('compare file list truncated at 300');

              const names = files.flatMap(f => [f.filename, f.previous_filename].filter(Boolean));
              const hits = names.filter(n => WATCHED.some(re => re.test(n)));
              if (hits.length) return build(`${hits.length} watched path(s): ` + hits.slice(0, 10).join(', '));
              return skip(`${files.length} file(s) changed, none of them watched`);
            } catch (e) {
              return build(`compare failed (${e.message})`);
            }

      - name: Checkout repo
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Python
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        if: steps.scope.outputs.relevant == 'true'
        working-directory: backend
        run: npm ci

      - name: Typecheck
        if: steps.scope.outputs.relevant == 'true'
        working-directory: backend
        run: npm run check

      - name: Build
        if: steps.scope.outputs.relevant == 'true'
        working-directory: backend
        run: npm run build

      - name: Route regression (TOPIC_KEYWORDS / SOURCE_SETS evaluated from the real source)
        if: steps.scope.outputs.relevant == 'true'
        run: node dev/source/route_regression.mjs

      - name: Ingest route-patcher self-test (the locator that caused this gate to exist)
        if: steps.scope.outputs.relevant == 'true'
        run: python3 dev/source/execute_ingest.py --self-test

      - name: Route the verdict (Issue only when main is actually broken)
        if: always()
        uses: actions/github-script@v7
        env:
          RELEVANT: ${{ steps.scope.outputs.relevant }}
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const LABEL = 'backend-build-broken';
            const failed = '${{ job.status }}' === 'failure';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // A scope-skipped run never compiled anything. It must not open an issue,
            // and — more importantly — it must not CLOSE an open one by looking green.
            if (process.env.RELEVANT !== 'true') {
              core.info('Scope skipped this commit — no build ran, so no issue routing.');
              return;
            }

            // Pull requests get the red check itself; an issue would be noise.
            if (context.eventName === 'pull_request') {
              core.info(`PR run, status=${failed ? 'failure' : 'success'} — no issue routing.`);
              return;
            }

            const openIssues = async () => (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL })).data;

            if (failed) {
              const body = [
                // @mention so this alarm still reaches Leonard now that "Watching" e-mail
                // is off (S232; same pattern as served_url_check.yml, S191). Only the
                // create below notifies — later silent body updates do not re-ping.
                '@Leonard-Wong-Git',
                '',
                `\`main\` does not build at \`${context.sha.slice(0, 7)}\`.`,
                '',
                `- Run: ${runUrl}`,
                `- Pushed by: \`${context.actor}\``,
                '',
                '**What this means right now:** Render builds from `main`. A failed build does not',
                'take production down — it keeps serving the last build that succeeded, and `/health`',
                'keeps answering `ok:true` with that older `commit`. So the symptom is not an outage,',
                'it is a **frozen deploy**: nothing merged after this point can reach production.',
                '',
                'Check what production is actually running:',
                '',
                '```bash',
                'curl -s https://edb-knowledge.onrender.com/health',
                '```',
                '',
                'and compare the executable code, not the hash:',
                '',
                '```bash',
                'git diff --name-only <that commit>..HEAD -- backend app.html',
                '```',
                '',
                '**If the failing commit came from the Option A watcher**, the edit it made to',
                '`searchChannelB.ts` is the first place to look — that is the exact failure this',
                'gate was built for (see the header comment in the workflow file).',
                '',
                '_This issue closes itself once a run on `main` goes green._',
              ].join('\n');
              const open = await openIssues();
              if (open.length) {
                await github.rest.issues.update({
                  owner, repo, issue_number: open[0].number,
                  title: `🔴 main does not compile (${context.sha.slice(0, 7)})`, body });
                core.info('Updated #' + open[0].number);
              } else {
                await github.rest.issues.create({
                  owner, repo, title: `🔴 main does not compile (${context.sha.slice(0, 7)})`,
                  body, labels: [LABEL] });
                core.info('Opened the breakage issue.');
              }
              return;
            }

            // Green: say nothing, but give any open breakage issue its exit.
            for (const iss of await openIssues()) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: iss.number,
                body: `✅ \`main\` builds again at \`${context.sha.slice(0, 7)}\` — ${runUrl}` });
              await github.rest.issues.update({
                owner, repo, issue_number: iss.number, state: 'closed' });
              core.info('Closed #' + iss.number);
            }
