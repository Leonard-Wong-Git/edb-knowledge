name: Weekly New-Source Discovery

on:
  schedule:
    # Every Monday at 10:00 UTC (one hour after the freshness check at 09:00)
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Crawl only the first N watch pages (0 = all)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write      # the seen-ledger only; discovery still never writes the registry
  issues: write        # open/update the "new EDB documents discovered" issue

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Self-test (offline logic)
        run: python3 dev/source/discover_sources.py --self-test

      - name: Crawl for new documents
        run: |
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          ARG=""
          if [ "$LIMIT" != "0" ] && [ -n "$LIMIT" ]; then ARG="--limit $LIMIT"; fi
          echo "Running: discover_sources.py --check $ARG"
          python3 dev/source/discover_sources.py --check $ARG \
            --changes-out discovered_sources.json \
            --ledger discovered_sources.md \
            --seen-ledger dev/source/discovery_seen.json 2>&1 | tee discover_output.txt
          exit ${PIPESTATUS[0]}

      - name: Commit the seen-ledger
        # This file is what lets the next run say "3 new" instead of re-announcing
        # a backlog that has been sitting there for months. A partial crawl would
        # prune candidates it never looked at, so --limit runs never persist it.
        if: (github.event.inputs.limit || '0') == '0'
        run: |
          if git diff --quiet dev/source/discovery_seen.json; then
            echo "seen-ledger unchanged"; exit 0
          fi
          git config user.name "discovery-bot[bot]"
          git config user.email "discovery-bot@users.noreply.github.com"
          git add dev/source/discovery_seen.json
          git commit -q -m "chore(discovery): update the first-seen ledger"
          git pull --rebase --autostash origin main && git push

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-report-${{ github.run_number }}
          path: |
            discover_output.txt
            discovered_sources.json
            discovered_sources.md
          retention-days: 30

      - name: Notify on new documents (open/update issue)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let r;
            try {
              r = JSON.parse(fs.readFileSync('discovered_sources.json', 'utf8'));
            } catch (e) { core.info('No discovery report: ' + e); return; }

            const real = (r.candidates || []).filter(c => !c.likely_noise);
            // S209: report what APPEARED, not the standing inventory. The backlog of
            // documents sitting on EDB index pages but not in the registry only grows —
            // most will never be ingested — so re-announcing all of it every week turned
            // the alert into wallpaper. `is_new` comes from the seen-ledger.
            const fresh = real.filter(c => c.is_new);
            const label = 'new-source-discovery';
            const title = '🆕 Discovery: new EDB documents pending triage';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label,
            });
            if (fresh.length < 1) {
              // Nothing new. Close it rather than leave a stale list open for ever; it
              // reopens by itself the week something actually appears.
              if (existing.data.length) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.data[0].number,
                  body: `✅ Run #${context.runNumber} (${r.generated_at}): nothing new on the watched index pages. Standing backlog: ${real.length} untriaged candidate(s) — see the run artifact. Closing; it reopens when something new appears.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.data[0].number, state: 'closed',
                });
                core.info('Closed #' + existing.data[0].number + ' — nothing new.');
              } else {
                core.info('Nothing new; no open issue to close.');
              }
              return;
            }
            const top = fresh.slice(0, 20).map(c => {
              const land = (c.landing_page || '').split('/').slice(-2, -1)[0] || '';
              return `- \`${c.filename}\`${c.basename_known_elsewhere ? ' _(basename seen elsewhere — likely dup)_' : ''}  \n  ${c.url}  \n  _from: ${land}_`;
            }).join('\n');
            const backlog = real.length - fresh.length;
            const body = [
              `🆕 **${fresh.length}** newly-appeared EDB document(s) on watched index pages `,
              `(run #${context.runNumber}, ${r.generated_at}; ${r.new_candidates} raw candidates, `,
              `${r.js_suspect_pages} JS-suspect pages, ${r.page_errors} page errors).`,
              '',
              '> **Triage only** — doc links found on known EDB index pages but NOT in '
              + '`source_registry.json`. Many will be dups / old versions / chapter-splits. '
              + 'Vet before any ingest (manual gate, per `FRESHNESS_GUIDE.md`).',
              '',
              top,
              '',
              fresh.length > 20 ? `…and ${fresh.length - 20} more new — see run artifact \`discovery-report-${context.runNumber}\`.` : '',
              backlog > 0 ? `\n<details><summary>📦 Standing backlog: ${backlog} candidate(s) first seen on an earlier run — not repeated here</summary>\n\nFull list in the run artifact, and every first-seen date in \`dev/source/discovery_seen.json\`.\n</details>` : '',
            ].join('\n');
            try {
              if (existing.data.length) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.data[0].number, title, body,
                });
                core.info('Updated issue #' + existing.data[0].number);
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title, body, labels: [label],
                });
                core.info('Created discovery issue.');
              }
            } catch (e) {
              core.warning('Failed to open/update discovery issue: ' + (e && e.message));
            }
