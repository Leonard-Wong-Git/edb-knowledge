name: Weekly Freshness Check

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      dry_run:
        description: "Run in dry-run mode (no registry update)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write      # needed to commit registry updates
  issues: write        # needed to open failure issues

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run freshness check (dry-run on schedule)
        id: freshness
        run: |
          # On schedule: always dry-run (human reviews before committing)
          # On manual dispatch: respect the input
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY_RUN="--dry-run"
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN="--dry-run"
          else
            DRY_RUN=""
          fi

          echo "Running: python3 dev/source/check_freshness.py $DRY_RUN"
          python3 dev/source/check_freshness.py $DRY_RUN 2>&1 | tee freshness_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report-${{ github.run_number }}
          path: freshness_output.txt
          retention-days: 30

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('freshness_output.txt')
              ? fs.readFileSync('freshness_output.txt', 'utf8')
              : '(output unavailable)';

            const today = new Date().toISOString().split('T')[0];
            const title = `[Freshness Alert] EDB URL failures detected — ${today}`;
            const body = [
              '## 🔴 EDB Source Registry — Freshness Check Failed',
              '',
              `**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              `**Date:** ${today}`,
              `**Trigger:** ${{ github.event_name }}`,
              '',
              '### Output',
              '```',
              output.slice(0, 6000),
              '```',
              '',
              '### Next Steps',
              '1. Review the failed URLs above.',
              '2. Browse the EDB site to find the new attachment paths.',
              '3. Update `dev/source/source_registry.json` with correct URLs.',
              '4. Run `python3 dev/source/check_freshness.py` (sync mode) to confirm fixes.',
              '5. Commit and push.',
            ].join('\n');

            // Avoid duplicate issues: check if one is already open for today
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'freshness-alert',
            });

            const alreadyOpen = issues.some(i => i.title.includes(today));
            if (!alreadyOpen) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['freshness-alert'],
              });
              console.log('Issue created.');
            } else {
              console.log('Issue for today already exists — skipping duplicate.');
            }

      - name: Commit registry update (manual sync mode only)
        if: >
          success() &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry_run == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev/source/source_registry.json
          if git diff --cached --quiet; then
            echo "No registry changes to commit."
          else
            git commit -m "chore: freshness sync — automated registry update (run #${{ github.run_number }})"
            git push
          fi
