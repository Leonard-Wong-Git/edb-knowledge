name: Weekly Freshness Check

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      dry_run:
        description: "Run in dry-run mode (no registry update)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write      # needed to commit registry updates (manual sync mode)

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run freshness check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY_RUN="--dry-run"
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN="--dry-run"
          else
            DRY_RUN=""
          fi

          echo "Running: python3 dev/source/check_freshness.py $DRY_RUN"
          python3 dev/source/check_freshness.py $DRY_RUN 2>&1 | tee freshness_output.txt
          exit ${PIPESTATUS[0]}
        # ↑ Non-zero exit = GitHub marks run as FAILED → sends email notification automatically

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report-${{ github.run_number }}
          path: freshness_output.txt
          retention-days: 30

      - name: Commit registry update (manual sync mode only)
        if: >
          success() &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry_run == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev/source/source_registry.json
          if git diff --cached --quiet; then
            echo "No registry changes to commit."
          else
            git commit -m "chore: freshness sync — automated registry update (run #${{ github.run_number }})"
            git push
          fi

