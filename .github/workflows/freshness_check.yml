name: Weekly Freshness Check

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      dry_run:
        # Default dry-run is the safe choice; select "false" to write+commit hashes/ledger.
        description: "Run in dry-run mode (no registry update)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write      # commit registry + ledger updates (manual write-sync mode)
  issues: write        # open/update the "source changes pending review" issue

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # first write-sync seeds content hashes for all 147 sources (one-time heavy); steady-state runs stay cheap

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run freshness check
        run: |
          DRY_RUN=""
          LEDGER=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY_RUN="--dry-run"
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN="--dry-run"
          else
            # manual write-sync: persist hashes + render the committed ledger
            LEDGER="--ledger dev/source/freshness_changes.md"
          fi

          echo "Running: python3 dev/source/check_freshness.py $DRY_RUN --changes-out freshness_changes.json $LEDGER"
          python3 dev/source/check_freshness.py $DRY_RUN --changes-out freshness_changes.json $LEDGER 2>&1 | tee freshness_output.txt
          exit ${PIPESTATUS[0]}
        # ↑ Non-zero exit = errors > threshold only (real outage). Detected CHANGES never
        #   affect exit code (S126 chronic-fail lesson). GitHub marks failed runs + emails.

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report-${{ github.run_number }}
          path: |
            freshness_output.txt
            freshness_changes.json
          retention-days: 30

      - name: Notify on content changes (open/update issue)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('freshness_changes.json', 'utf8'));
            } catch (e) {
              core.info('No change report to parse: ' + e);
              return;
            }
            if (!report.changes || report.changes < 1) {
              core.info('No content changes detected; not touching issue.');
              return;
            }
            const lines = (report.changed_sources || []).map(c =>
              `- \`${c.source_id}\` — ${c.title || ''} _(${c.confidence})_`).join('\n');
            const body = [
              `🔔 **${report.changes}** EDB source(s) changed (run #${context.runNumber}, ${report.generated_at}, ${report.dry_run ? 'dry-run detection' : 'write-sync'}).`,
              '',
              lines,
              '',
              '> **Detection only** — re-ingestion stays a manual gate. Per `dev/source/FRESHNESS_GUIDE.md`:',
              '> URL re-discovery → mojibake pre-flight → repage → cb3_b2 → SOURCE_SETS parity → deploy.',
              `> Full report: run artifact \`freshness-report-${context.runNumber}\`.`,
            ].join('\n');
            const title = '🔔 Freshness: EDB source changes pending review';
            const label = 'freshness-change';
            // Notification failure must not mask a successful detection run —
            // warn (not fail) so the operator can still inspect the artifact.
            try {
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: label,
              });
              if (existing.data.length) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.data[0].number, title, body,
                });
                core.info('Updated issue #' + existing.data[0].number);
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title, body, labels: [label],
                });
                core.info('Created freshness-change issue.');
              }
            } catch (e) {
              core.warning('Failed to open/update freshness issue: ' + (e && e.message));
            }

      - name: Commit registry + ledger update (manual write-sync only)
        if: >
          success() &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry_run == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev/source/source_registry.json dev/source/freshness_changes.md
          if git diff --cached --quiet; then
            echo "No registry/ledger changes to commit."
          else
            git commit -m "chore: freshness sync — registry + change ledger (run #${{ github.run_number }})"
            git push
          fi
