name: Weekly Freshness Check

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      dry_run:
        # Default dry-run is the safe choice; select "false" to write+commit hashes/ledger.
        description: "Run in dry-run mode (no registry update)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write      # commit registry + ledger updates (manual write-sync mode)
  issues: write        # open/update the "source changes pending review" issue

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # first write-sync seeds content hashes for all 147 sources (one-time heavy); steady-state runs stay cheap

    steps:
      # S224: pushes over SSH with a write deploy key, not GITHUB_TOKEN. The main
      # ruleset requires the build-gate check, which no direct push can ever satisfy
      # (the check only runs after the push lands). Deploy keys are the one bypass
      # actor a user-owned repo can use — the built-in GitHub Actions app is refused
      # with "must be part of the ruleset source or owner organization". This ledger
      # commit touches no backend code, so it is bypass-safe by construction.
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.LEDGER_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run freshness check
        run: |
          DRY_RUN=""
          LEDGER=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # S249: a scheduled run still seeds a baseline for rows that have
            # none (newly ingested sources). It cannot hide a change — there was
            # nothing to compare against — and without it those sources are
            # never checked for content change (95 were not, before S249).
            DRY_RUN="--dry-run --seed-missing"
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN="--dry-run"
          else
            # manual write-sync: persist hashes + render the committed ledger
            LEDGER="--ledger dev/source/freshness_changes.md"
          fi

          echo "Running: python3 dev/source/check_freshness.py $DRY_RUN --changes-out freshness_changes.json $LEDGER"
          python3 dev/source/check_freshness.py $DRY_RUN --changes-out freshness_changes.json $LEDGER 2>&1 | tee freshness_output.txt
          exit ${PIPESTATUS[0]}
        # ↑ Non-zero exit = errors > threshold only (real outage). Detected CHANGES never
        #   affect exit code (S126 chronic-fail lesson). GitHub marks failed runs + emails.

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report-${{ github.run_number }}
          path: |
            freshness_output.txt
            freshness_changes.json
          retention-days: 30

      - name: Notify on content changes (open/update issue)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('freshness_changes.json', 'utf8'));
            } catch (e) {
              core.info('No change report to parse: ' + e);
              return;
            }
            const label = 'freshness-change';
            if (!report.changes || report.changes < 1) {
              // S249 (same rule as served-url, S209): a list that can only grow
              // becomes wallpaper. When every change has been acknowledged the
              // issue closes itself; it reopens on the next real change.
              const open = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label,
              });
              if (open.data.length && (report.errors || 0) === 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: open.data[0].number,
                  body: `✅ Run #${context.runNumber} (${report.generated_at}): ${report.checked} 個來源全部與基線一致，沒有待處理的更新。自動關閉；之後有新的更新會重新開啟並通知。`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: open.data[0].number, state: 'closed',
                });
                core.info('Closed #' + open.data[0].number + ' — nothing pending.');
              } else {
                core.info('No content changes detected; nothing to close.');
              }
              return;
            }
            const linkNote = c => {
              const l = c.links;
              if (!l || (!l.added.length && !l.removed.length)) return '';
              const fmt = (tag, arr) => arr.slice(0, 5).map(u => `\n  - ${tag} ${u}`).join('')
                + (arr.length > 5 ? `\n  - ${tag} ……另有 ${arr.length - 5} 條` : '');
              return fmt('新增連結', l.added) + fmt('移除連結', l.removed);
            };
            const lines = (report.changed_sources || []).map(c =>
              `- \`${c.source_id}\` — ${c.title || ''} _(${c.confidence})_${linkNote(c)}`).join('\n');
            const body = [
              `🔔 **${report.changes}** EDB source(s) changed (run #${context.runNumber}, ${report.generated_at}, ${report.dry_run ? 'dry-run detection' : 'write-sync'}).`,
              '',
              lines,
              '',
              '> **Detection only** — re-ingestion stays a manual gate. Per `dev/source/FRESHNESS_GUIDE.md`:',
              '> URL re-discovery → mojibake pre-flight → repage → cb3_b2 → SOURCE_SETS parity → deploy.',
              '> 處理完一項（已重新入庫，或判定無需處理）後跑 `check_freshness.py --ack <source_id>`，該項便會離開清單。',
              `> Full report: run artifact \`freshness-report-${context.runNumber}\`.`,
            ].join('\n');
            const title = '🔔 Freshness: EDB source changes pending review';
            // S238: body edits never notify, and this issue had no @mention — four
            // months of changes reached nobody. The shared helper announces NEW
            // sources in a comment that @mentions Leonard (see the helper header).
            const notify = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/notify_new_items.js`);
            const items = (report.changed_sources || []).map(c => ({
              key: c.source_id,
              text: `\`${c.source_id}\` ${c.title || ''}`,
            }));
            // Notification failure must not mask a successful detection run —
            // warn (not fail) so the operator can still inspect the artifact.
            try {
              await notify({
                github, context, core, label, title, body, items,
                // S249: an acknowledged source is forgotten, so a LATER change
                // to it is announced again instead of being taken for old news.
                forget: report.acked_sources || [],
                headline: n => `需要你決定：${n} 個來源的原文有更新`,
                action: '在 Claude 說「處理 freshness 更新」。AI 會下載新版、與庫內版本逐段比對，列出實質改動並建議是否重新入庫；未經你批准不會寫入任何資料。',
              });
            } catch (e) {
              core.warning('Failed to open/update freshness issue: ' + (e && e.message));
            }

      # A plain dry run leaves the registry byte-identical, so this is a no-op
      # for it. It commits for a manual write-sync, and (S249) for a scheduled
      # run that seeded a baseline for a source that had none.
      - name: Commit registry + ledger update (write-sync, or newly seeded baselines)
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev/source/source_registry.json
          if [ -f dev/source/freshness_changes.md ]; then git add dev/source/freshness_changes.md; fi
          if git diff --cached --quiet; then
            echo "No registry/ledger changes to commit."
          else
            git commit -m "chore: freshness sync — registry + change ledger (run #${{ github.run_number }})"
            git push
          fi
